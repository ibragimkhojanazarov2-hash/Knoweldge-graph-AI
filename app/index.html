<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia — библиотека</title>
<script>
  // Тему ставим до отрисовки: иначе в тёмной системе страница мигнёт белым.
  (function () {
    const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    try {
      document.documentElement.dataset.theme = localStorage.getItem("theme") || system;
    } catch (error) {
      document.documentElement.dataset.theme = system;
    }
  })();
</script>
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #FFFDF9;
    --ink: #1F1B16;
    --ink-muted: #6B6358;
    --line: #E4DCCC;
    --accent: #B4532A;
    --book-a: #8C6239;
    --book-b: #4F6B72;
    --book-c: #7A5C99;
    --book-d: #A0782E;
    --book-e: #5F7D3E;
    --book-f: #9A5B4F;
    --supports: #4F7A5A;
    --contradicts: #B23A48;
    --extends: #3D5A98;
    --example: #C08A2E;
    --same: #8A8278;
    --shadow: 0 18px 40px -24px rgba(60, 45, 25, .45);
    --serif: "Times New Roman", Times, "Tinos", "Liberation Serif", serif;
    --sans: "Manrope", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #13110E;
    --surface: #1C1915;
    --ink: #EFE7DA;
    --ink-muted: #A79C8B;
    --line: #322C24;
    --accent: #D07A4E;
    --book-a: #B08155;
    --book-b: #6E8F97;
    --book-c: #9C82B8;
    --book-d: #C49A4A;
    --book-e: #7F9E5C;
    --book-f: #B47A6C;
    --supports: #6C9B78;
    --contradicts: #D15E6B;
    --extends: #6C86C4;
    --example: #D9A646;
    --same: #A39A8E;
    --shadow: 0 18px 40px -24px rgba(0, 0, 0, .7);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    transition: background .25s, color .25s;
  }
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 24px;
    padding: 14px 32px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: .02em;
  }
  .brand span { color: var(--accent); }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-link {
    padding: 7px 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--ink-muted);
    font-size: 14px;
    text-decoration: none;
  }
  .nav-link:hover { color: var(--ink); border-color: var(--line); }
  .nav-link.active { color: var(--ink); border-color: var(--line); background: var(--surface); }
  .icon-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-muted);
    font-size: 15px;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-muted); }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 32px 80px; }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 42px;
    line-height: 1.15;
    margin: 0 0 8px;
  }
  .lead { color: var(--ink-muted); margin: 0 0 32px; max-width: 560px; }
  .upload {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 20px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    background: var(--surface);
    margin-bottom: 40px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #FFF8F2;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .55; cursor: default; filter: none; }
  .hint { color: var(--ink-muted); font-size: 13px; }
  .note { font-size: 14px; }
  .note.error { color: #B3261E; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 30px 24px;
  }
  .card { text-align: left; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font: inherit; }
  .cover {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 6px 12px 12px 6px;
    background: linear-gradient(150deg, var(--book-a), var(--book-b));
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px 18px;
    color: #FBF6EC;
    transition: transform .2s;
  }
  .card:hover .cover { transform: translateY(-4px); }
  .cover::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 9px;
    background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.06) 60%, rgba(0,0,0,.12));
  }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover-title { position: relative; z-index: 1; font-family: var(--serif); font-size: 20px; line-height: 1.2; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .cover-author { position: relative; z-index: 1; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .9; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .card-title { margin: 14px 0 2px; font-family: var(--serif); font-size: 18px; }
  .card-meta { color: var(--ink-muted); font-size: 13px; }
  .card-links {
    display: inline-block; margin-top: 6px; padding: 1px 8px;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink-muted); font-size: 12px;
  }
  /* «Связь дня» — самая уверенная связь, каждый день другая. */
  .link-day {
    margin: 28px 0 34px; padding: 20px 22px;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface);
  }
  .link-day-label {
    margin: 0 0 14px; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-muted);
  }
  .link-day-pair {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 18px; align-items: center;
  }
  .link-day-book { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .link-day-side h3 { margin: 4px 0 0; font-family: var(--serif); font-size: 17px; line-height: 1.35; }
  .link-day-quote {
    margin: 10px 0 0; padding: 8px 10px;
    border-left: 3px solid var(--line);
    background: var(--bg); border-radius: 0 8px 8px 0;
    font-family: var(--serif); font-size: 13.5px; line-height: 1.45;
  }
  .link-day-why {
    margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 13px; line-height: 1.45; color: var(--ink-muted);
  }
  .link-day-why b { color: var(--ink); font-weight: 600; }
  .link-day-actions {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 14px;
  }
  .link-day-mid {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12px; text-align: center; white-space: nowrap;
  }
  .link-day-mid .bridge-icon { font-size: 18px; }
  .link-day-mid b { font-size: 13px; }
  .link-day-more {
    display: inline-block; font-size: 13px;
    color: var(--ink-muted); text-decoration: none;
  }
  .link-day-more:hover { color: var(--ink); }
  @media (max-width: 560px) {
    .link-day-pair { grid-template-columns: 1fr; gap: 10px; }
    .link-day-mid { flex-direction: row; justify-content: flex-start; gap: 6px; }
  }
  .empty {
    padding: 48px 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    text-align: center;
    color: var(--ink-muted);
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 26px;
    border: 0; background: none; padding: 0;
    color: var(--ink-muted); font: inherit; font-size: 14px; cursor: pointer;
  }
  .back:hover { color: var(--ink); }
  .book-head { display: flex; gap: 36px; align-items: flex-start; margin-bottom: 44px; }
  .book-head .cover { width: 230px; flex: 0 0 230px; }
  .book-info h1 { font-size: 40px; }
  .book-author { margin: 0 0 18px; color: var(--ink-muted); font-size: 16px; }
  .facts { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .fact b { display: block; font-family: var(--serif); font-size: 22px; font-weight: 400; }
  .fact span { color: var(--ink-muted); font-size: 13px; }
  .book-about {
    margin: 20px 0 0; max-width: 64ch;
    color: var(--ink-muted); font-size: 15px; line-height: 1.65;
  }
  .chapters { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .chapter-row {
    display: flex; align-items: baseline; gap: 16px;
    width: 100%; padding: 14px 4px;
    border: 0; border-bottom: 1px solid var(--line);
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .chapter-row:hover .name { color: var(--accent); }
  .chapters .num { flex: 0 0 34px; color: var(--ink-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .chapters .name { flex: 1; font-family: var(--serif); font-size: 19px; }
  .chapters .size { color: var(--ink-muted); font-size: 12px; white-space: nowrap; }
  .reader { max-width: 660px; }
  .reader h1 { font-size: 34px; margin: 0 0 6px; }
  .reader-meta { color: var(--ink-muted); font-size: 13px; margin-bottom: 30px; }
  .reader-text { font-family: var(--serif); font-size: 19px; line-height: 1.7; }
  .reader-text p { margin: 0 0 1.1em; }
  .tabs {
    display: inline-flex; gap: 4px; padding: 4px; margin: 0 0 26px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  .tab {
    border: 0; border-radius: 999px; background: none;
    color: var(--ink-muted); font: inherit; font-size: 13px;
    padding: 7px 16px; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--accent); color: #FFF8F2; }
  html[data-theme="dark"] .tab[aria-selected="true"] { color: #1C1915; }
  .ideas { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .idea {
    padding: 20px 22px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
  }
  .idea-text { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; line-height: 1.35; }
  .idea blockquote {
    margin: 0 0 12px; padding-left: 14px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 16px; line-height: 1.6;
    color: var(--ink-muted);
  }
  .idea-why { margin: 0; font-size: 13px; color: var(--ink-muted); }
  .idea-rank {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 10px; font-size: 12px; color: var(--ink-muted);
  }
  .rank-num { letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .idea-chapter {
    border: 0; background: none; padding: 0;
    font: inherit; color: var(--accent); cursor: pointer; text-align: left;
  }
  .idea-chapter:hover { text-decoration: underline; }
  .summary-about {
    margin: 0 0 26px; font-family: var(--serif); font-size: 20px; line-height: 1.5;
  }
  .summary-points {
    margin: 0; padding: 0 0 0 26px;
    font-size: 16px; line-height: 1.55;
  }
  .summary-points li { margin: 0 0 14px; padding-left: 4px; }
  .summary-points li::marker { color: var(--accent); font-variant-numeric: tabular-nums; }
  .section-title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px; }
  .idea-link { color: inherit; text-decoration: none; }
  .idea-link:hover { color: var(--accent); }
  .idea-link::after { content: " →"; color: var(--ink-muted); }
  .idea-page .idea-text { margin: 0 0 16px; }
  .idea-page blockquote,
  .link-card blockquote {
    margin: 0 0 12px; padding-left: 14px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 16px; line-height: 1.6;
    color: var(--ink-muted);
  }
  .idea-page .idea-why { margin-bottom: 30px; }
  .note-form { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: 0 0 18px; }
  .note-form textarea {
    width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface, transparent); color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1.5;
  }
  .note-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .notes { list-style: none; margin: 0 0 30px; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .note-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .note-text { margin: 0 0 8px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-meta { margin: 0; display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-muted); }
  .note-del {
    border: 0; padding: 0; background: none; color: var(--ink-muted);
    font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline;
  }
  .note-del:hover { color: var(--accent); }
  #noteList .hint { margin: 0 0 30px; }
  .link-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    margin: 0 0 8px; font-size: 12px; color: var(--ink-muted);
  }
  .link-type { color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
  .link-idea { margin: 0 0 10px; font-family: var(--serif); font-size: 18px; line-height: 1.35; }
  .link-why { margin: 10px 0 0; font-size: 13px; color: var(--ink-muted); }
  /* --- карта идей --- */
  main.map-main {
    max-width: none;
    padding: 0;
    height: calc(100vh - 65px);
    height: calc(100dvh - 65px);
    overflow: hidden;
  }
  .map-screen { display: grid; grid-template-columns: 224px 1fr; height: 100%; position: relative; }
  .map-filters {
    border-right: 1px solid var(--line);
    background: var(--surface);
    padding: 22px 18px 32px;
    overflow-y: auto;
    min-width: 0;
  }
  .map-filters h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0 0 2px; }
  .map-filters .count { color: var(--ink-muted); font-size: 12px; margin: 0 0 22px; }
  .fgroup { margin-bottom: 22px; }
  .fgroup-title {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-muted); margin: 0 0 6px;
  }
  .frow {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-size: 13px; cursor: pointer; user-select: none;
  }
  .frow input { accent-color: var(--accent); margin: 0; }
  .fdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .fline { width: 22px; height: 0; border-top-width: 2px; border-top-style: solid; flex: none; }
  .fcount { margin-left: auto; color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .frange { width: 100%; accent-color: var(--accent); margin: 4px 0 2px; }
  .fvalue { color: var(--ink-muted); font-size: 12px; display: flex; justify-content: space-between; }
  .fnote { color: var(--ink-muted); font-size: 12px; line-height: 1.4; }
  .map-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .map-canvas { position: relative; overflow: hidden; background: var(--bg); min-width: 0; flex: 1; }
  #mapSvg { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
  #mapSvg.panning { cursor: grabbing; }
  .map-tools {
    flex: none;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 14px; border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .map-tools button {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  .map-tools button:hover { border-color: var(--ink-muted); }
  .map-tools .wide { width: auto; padding: 0 10px; font-size: 12px; }
  .map-tools label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); padding: 0 6px; cursor: pointer; }
  #filtersBtn { display: none; }
  .map-edge { fill: none; cursor: pointer; }
  .map-edge.sel { opacity: 1; }
  .map-edge.sel path { opacity: 1; }
  .map-edge-badge { fill: var(--bg); stroke-width: 1.5; }
  .map-edge-icon {
    font-family: var(--sans); font-size: 11px; text-anchor: middle;
    dominant-baseline: central; paint-order: stroke; stroke: var(--bg);
    stroke-width: 2px; pointer-events: none;
  }
  .map-node { cursor: pointer; }
  .map-node circle { stroke: var(--surface); stroke-width: 1.5; transition: opacity .15s; }
  .map-node.sel circle { stroke: var(--ink); stroke-width: 2.5; }
  .map-node text {
    font-family: var(--sans); font-size: 14px; fill: var(--ink);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  .map-node.sel text { font-weight: 600; }
  .map-edge.dim, .map-node.dim { opacity: .15; }
  .map-head-title {
    font-family: var(--serif); font-size: 16px; fill: var(--ink);
  }
  .map-head-count { font-size: 11px; fill: var(--ink-muted); }
  .map-head-initial { font-family: var(--serif); font-size: 24px; fill: var(--ink); }
  .map-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 32px; color: var(--ink-muted); font-size: 14px;
    pointer-events: none;
  }
  .map-panel {
    position: absolute; top: 14px; right: 14px; bottom: 14px; z-index: 4;
    width: min(360px, calc(100% - 28px));
    padding: 22px 22px 26px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow-y: auto;
  }
  .map-panel[hidden] { display: none; }
  .p-close {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border: 0; border-radius: 50%;
    background: none; color: var(--ink-muted); font: inherit; font-size: 17px; cursor: pointer;
  }
  .p-close:hover { color: var(--ink); background: var(--bg); }
  .p-kicker { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; padding-right: 30px; }
  .p-idea { font-family: var(--serif); font-size: 21px; line-height: 1.3; margin: 0 0 10px; }
  .p-badge {
    display: inline-block; margin: 0 0 12px; padding: 3px 10px;
    border-radius: 999px; font-size: 11px; letter-spacing: .05em;
    border: 1px solid currentColor;
  }
  .p-badge.right { color: var(--supports); }
  .p-badge.wrong { color: var(--contradicts); }
  .p-meta { color: var(--ink-muted); font-size: 12px; margin: 0 0 16px; }
  .p-quote {
    margin: 0 0 14px; padding: 12px 14px;
    border-left: 3px solid var(--accent);
    background: var(--bg); border-radius: 0 8px 8px 0;
    font-family: var(--serif); font-size: 15px; line-height: 1.45;
  }
  .p-quote i { font-style: italic; }
  .p-why { font-size: 13px; color: var(--ink-muted); margin: 0 0 18px; }
  .p-why b { color: var(--ink); font-weight: 600; }
  .p-links-title {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-muted); margin: 0 0 8px;
    padding-top: 14px; border-top: 1px solid var(--line);
  }
  .p-link { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .p-link:last-child { border-bottom: 0; }
  .p-link-type { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .p-link-idea {
    display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0;
    margin: 4px 0 0; font: inherit; font-size: 13px; line-height: 1.4; color: var(--ink);
    cursor: pointer;
  }
  .p-link-idea:hover { color: var(--accent); }
  .p-link-book { color: var(--ink-muted); font-size: 11px; }
  .p-link-why { margin: 5px 0 0; font-size: 12px; color: var(--ink-muted); line-height: 1.4; }
  .p-link-conf { color: var(--ink-muted); font-size: 11px; }
  .p-pair { padding: 14px 0; border-top: 1px solid var(--line); }
  .p-pair:first-of-type { border-top: 0; }
  .p-pair-book { color: var(--ink-muted); font-size: 11px; margin: 0 0 6px; }
  .p-pair-idea { font-family: var(--serif); font-size: 17px; line-height: 1.35; margin: 0 0 10px; font-weight: 400; }
  .p-pair-mid {
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; margin: 2px 0;
  }
  .p-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .vbtn {
    padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
  }
  .vbtn:hover { border-color: var(--ink-muted); }
  .vbtn.right.on { color: var(--supports); border-color: var(--supports); background: color-mix(in srgb, var(--supports) 12%, var(--surface)); }
  .vbtn.wrong.on { color: var(--contradicts); border-color: var(--contradicts); background: color-mix(in srgb, var(--contradicts) 12%, var(--surface)); }
  .p-edit { width: 100%; }
  .p-edit textarea {
    width: 100%; margin: 8px 0; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink);
    font: inherit; font-size: 14px; line-height: 1.45; resize: vertical;
  }
  .p-edit textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .p-edit-actions { display: flex; gap: 6px; }
  /* Мосты: межкнижные связи карточками, сгруппированные по смыслу. */
  .bridges { max-width: 980px; margin: 0 auto; }
  .bridges .lead { margin-bottom: 22px; }
  .bridges-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  /* На телефоне карта тяжёлая, поэтому она открывается кнопкой из «Мостов». */
  .bridges-open-map { display: none; flex: none; align-self: flex-start; }
  @media (max-width: 700px) {
    .bridges-open-map { display: inline-flex; }
  }
  .bridges-controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px;
    padding: 0 0 22px; border-bottom: 1px solid var(--line);
  }
  .bridges-label { color: var(--ink-muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .bridges-controls .hint { margin: 0 0 0 auto; }
  .seg {
    display: inline-flex; gap: 4px; padding: 3px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  .seg button {
    border: 0; border-radius: 999px; background: none; color: var(--ink-muted);
    font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #FFF8F2; }
  .bgroup { margin-top: 34px; }
  .bgroup-head {
    display: flex; align-items: center; gap: 9px; margin: 0 0 14px;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .bgroup-icon { font-size: 15px; letter-spacing: 0; }
  .bgroup-count {
    margin-left: auto; color: var(--ink-muted);
    font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none;
  }
  .bridge {
    margin-bottom: 14px; padding: 20px 22px;
    border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
  }
  .bridge-pair { display: grid; grid-template-columns: 1fr 108px 1fr; gap: 18px; align-items: start; }
  .bridge-book {
    display: flex; align-items: center; gap: 6px; margin: 0 0 6px;
    color: var(--ink-muted); font-size: 11px;
  }
  .bridge-title { margin: 0 0 8px; font-family: var(--serif); font-weight: 400; font-size: 19px; line-height: 1.25; }
  .bridge-quote {
    margin: 0; padding: 10px 12px;
    border-left: 3px solid var(--line);
    background: var(--bg); border-radius: 0 8px 8px 0;
    font-family: var(--serif); font-size: 14px; line-height: 1.45;
  }
  .bridge-mid {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding-top: 24px; text-align: center;
  }
  .bridge-icon { font-size: 18px; }
  .bridge-type { font-size: 11px; letter-spacing: .04em; }
  .bridge-conf { color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .bridge-foot {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .bridge-why { flex: 1 1 320px; margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-muted); }
  .bridge-why b { color: var(--ink); font-weight: 600; }
  .bridge-open {
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--ink);
    font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer;
  }
  .bridge-open:hover { border-color: var(--ink-muted); }
  .bridge-empty {
    padding: 26px 20px; border: 1px dashed var(--line); border-radius: 14px;
    color: var(--ink-muted); font-size: 14px; text-align: center;
  }
  @media (max-width: 860px) {
    .bridge { padding: 16px; }
    .bridge-pair { grid-template-columns: 1fr; gap: 10px; }
    .bridge-mid { flex-direction: row; justify-content: flex-start; padding: 0; gap: 8px; }
    .bridges-controls .hint { margin-left: 0; }
  }
  @media (max-width: 860px) {
    .map-screen { grid-template-columns: 1fr; }
    .map-filters {
      position: absolute; top: 58px; bottom: 0; left: 0; z-index: 6; width: 268px;
      transform: translateX(-100%); transition: transform .2s;
      box-shadow: var(--shadow);
    }
    .map-screen.filters-open .map-filters { transform: none; }
    .map-tools { z-index: 7; }
    #filtersBtn { display: inline-flex; width: auto; padding: 0 10px; font-size: 12px; }
    .map-panel { z-index: 8; width: min(340px, calc(100% - 28px)); }
  }
  @media (max-width: 720px) {
    .top { padding: 12px 14px; gap: 12px; }
    .brand { font-size: 14px; }
    .top-actions { gap: 4px; }
    .nav-link { padding: 6px 8px; font-size: 12px; }
    .icon-btn { width: 32px; height: 32px; }
    main { padding: 28px 18px 60px; }
    h1 { font-size: 32px; }
    .book-head { flex-direction: column; gap: 22px; }
    .book-head .cover { width: 170px; flex: none; }
    .book-info h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">MARGIN<span>·</span>ALIA</div>
  <div class="top-actions">
    <a class="nav-link" id="libLink" href="#/">Библиотека</a>
    <a class="nav-link" id="mapLink" href="#/map">Карта</a>
    <a class="nav-link" id="bridgesLink" href="#/bridges">Мосты</a>
    <button class="icon-btn" id="themeBtn" type="button" title="Светлая или тёмная тема">◐</button>
  </div>
</header>

<main id="app"></main>

<input type="file" id="file" accept=".epub,.txt" hidden>
<script>
  const app = document.getElementById("app");
  const themeBtn = document.getElementById("themeBtn");
  const libLink = document.getElementById("libLink");
  const mapLink = document.getElementById("mapLink");
  const bridgesLink = document.getElementById("bridgesLink");
  const fileInput = document.getElementById("file");

  const pageBase = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
  let chapterView = "text";  // какая вкладка открыта в читалке: текст или идеи
  let bookView = "chapters"; // какая вкладка открыта на странице книги: главы или ключевые идеи

  async function api(path, options) {
    const response = await fetch(pageBase + path, options);
    if (!response.ok) throw new Error((await response.text()) || ("Ошибка " + response.status));
    return response.json();
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function plural(n, one, few, many) {
    const ten = n % 10, hundred = n % 100;
    if (ten === 1 && hundred !== 11) return one;
    if (ten >= 2 && ten <= 4 && (hundred < 12 || hundred > 14)) return few;
    return many;
  }

  function chaptersWord(n) { return plural(n, "глава", "главы", "глав"); }
  function ideasWord(n) { return plural(n, "идея", "идеи", "идей"); }
  function linksWord(n) { return plural(n, "связь", "связи", "связей"); }

  // Первые предложения конспекта — короткая выжимка справа от обложки.
  function firstSentences(text, limit) {
    const parts = String(text || "").match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [];
    return parts.slice(0, limit).join(" ").replace(/\s+/g, " ").trim();
  }

  function number(n) {
    return new Intl.NumberFormat("ru-RU").format(n);
  }

  function coverMarkup(book, extraClass) {
    if (book.cover) {
      return `<div class="cover ${extraClass || ""}">
        <img src="${esc(pageBase)}covers/${encodeURIComponent(book.cover)}" alt="Обложка: ${esc(book.title)}">
      </div>`;
    }
    return `<div class="cover ${extraClass || ""}">
      <div class="cover-title">${esc(book.title)}</div>
      <div class="cover-author">${esc(book.author || "Без автора")}</div>
    </div>`;
  }

  function showLibrary() {
    app.innerHTML = `
      <h1>Библиотека</h1>
      <p class="lead">Добавьте книги — Marginalia найдёт идеи и покажет, где авторы согласны и где спорят.</p>
      <div class="upload">
        <button class="btn" type="button" id="addBtn">Добавить книгу</button>
        <span class="hint">EPUB или TXT, до 100 МБ</span>
        <span class="note" id="note"></span>
      </div>
      <div id="linkDay"></div>
      <div id="shelf"></div>`;

    document.getElementById("addBtn").addEventListener("click", () => fileInput.click());
    loadShelf();
    loadLinkOfDay();
  }

  // Самая уверенная связь дня: из нескольких самых сильных выбираем одну
  // по номеру дня, поэтому назавтра будет другая.
  function linkOfDay(links, byId) {
    const sorted = links
      .filter((link) => byId.has(Number(link.from_id)) && byId.has(Number(link.to_id)))
      .sort((a, b) => Number(b.confidence) - Number(a.confidence) || a.from_id - b.from_id);
    if (!sorted.length) return null;
    // Берём только сильные связи; если таких совсем мало — первые по уверенности.
    const strong = sorted.filter((link) => Number(link.confidence) >= STRONG_CONF);
    const pool = strong.length > 1 ? strong : sorted.slice(0, 5);
    const day = Math.floor(Date.now() / 86400000);
    return pool[day % pool.length];
  }

  function linkDayMarkup(graph) {
    const byId = new Map(graph.ideas.map((idea) => [Number(idea.id), idea]));
    const link = linkOfDay(graph.links, byId);
    if (!link) return "";
    const first = byId.get(Number(link.from_id));
    const second = byId.get(Number(link.to_id));
    const style = LINK_STYLES[link.type] || LINK_STYLES.same;
    const side = (idea) => '<div class="link-day-side">'
      + '<span class="link-day-book">' + esc(shortText(idea.book_title, 32)) + '</span>'
      + '<h3>' + esc(idea.title || shortText(idea.idea, 80)) + '</h3>'
      + (idea.quote ? '<blockquote class="link-day-quote">«' + esc(idea.quote) + '»</blockquote>' : "")
      + '</div>';
    return '<section class="link-day">'
      + '<p class="link-day-label">Связь дня</p>'
      + '<div class="link-day-pair">'
      + side(first)
      + '<div class="link-day-mid" style="color:' + style.color + '">'
      + '<span class="bridge-icon">' + style.icon + '</span>'
      + '<span>' + esc(LINK_TYPES[link.type] || link.type) + '</span>'
      + '<b>' + Math.round(Number(link.confidence) * 100) + '%</b>'
      + '</div>'
      + side(second)
      + '</div>'
      + (link.explanation
        ? '<p class="link-day-why"><b>Почему связаны:</b> ' + esc(link.explanation) + '</p>'
        : "")
      + '<div class="link-day-actions">'
      + '<button type="button" class="bridge-open" data-open-pair="'
      + link.from_id + '-' + link.to_id + '">Открыть на карте →</button>'
      + '<a class="link-day-more" href="#/bridges">Все мосты →</a>'
      + '</div>'
      + '</section>';
  }

  async function loadLinkOfDay() {
    const slot = document.getElementById("linkDay");
    if (!slot) return;
    let graph;
    try {
      graph = await api("api/graph");
    } catch (error) {
      if (slot.isConnected) slot.innerHTML = '<p class="note error">' + esc(error.message) + '</p>';
      return;
    }
    if (!slot.isConnected) return;
    slot.innerHTML = linkDayMarkup(graph);
    const open = slot.querySelector("[data-open-pair]");
    if (open) open.addEventListener("click", () => {
      const [from, to] = open.dataset.openPair.split("-").map(Number);
      pendingBridge = { from, to };
      if (location.hash === "#/map") showMap();
      else location.hash = "#/map";
    });
  }

  async function loadShelf() {
    const shelf = document.getElementById("shelf");
    let books;
    try {
      books = await api("api/books");
    } catch (error) {
      shelf.innerHTML = `<p class="note error">${esc(error.message)}</p>`;
      return;
    }
    if (!books.length) {
      shelf.innerHTML = `<div class="empty">Пока пусто. Добавьте первую книгу.</div>`;
      return;
    }
    shelf.innerHTML = `<div class="grid">${books.map((book) => `
      <button class="card" type="button" data-book="${esc(book.id)}">
        ${coverMarkup(book)}
        <div class="card-title">${esc(book.title)}</div>
        <div class="card-meta">${esc(book.author || "Без автора")} · ${book.chapter_count} ${chaptersWord(book.chapter_count)}</div>
        <div class="card-links">${book.link_count || 0} ${linksWord(book.link_count || 0)}</div>
      </button>`).join("")}</div>`;

    shelf.querySelectorAll("[data-book]").forEach((card) => {
      card.addEventListener("click", () => { location.hash = "/book/" + card.dataset.book; });
    });
  }

  async function uploadBook(file) {
    const note = document.getElementById("note");
    const button = document.getElementById("addBtn");
    if (!note || !button) return;
    note.className = "note";
    note.textContent = "Разбираю книгу…";
    button.disabled = true;
    try {
      const result = await api("api/upload", {
        method: "POST",
        headers: { "X-Filename": encodeURIComponent(file.name) },
        body: file
      });
      location.hash = "/book/" + result.id;
    } catch (error) {
      note.className = "note error";
      note.textContent = error.message;
    } finally {
      button.disabled = false;
      fileInput.value = "";
    }
  }

  async function showBook(id) {
    app.innerHTML = `<button class="back" type="button" id="backBtn">← Библиотека</button><p class="hint">Открываю книгу…</p>`;
    document.getElementById("backBtn").addEventListener("click", () => { location.hash = ""; });

    let book, keyIdeas, summary;
    try {
      [book, keyIdeas, summary] = await Promise.all([
        api("api/books/" + encodeURIComponent(id)),
        api("api/books/" + encodeURIComponent(id) + "/key-ideas"),
        api("api/books/" + encodeURIComponent(id) + "/summary")
      ]);
    } catch (error) {
      app.innerHTML = `<button class="back" type="button" id="backBtn">← Библиотека</button>
        <p class="note error">${esc(error.message)}</p>`;
      document.getElementById("backBtn").addEventListener("click", () => { location.hash = ""; });
      return;
    }

    const chapters = book.chapters.map((chapter) => `
      <li>
        <button class="chapter-row" type="button" data-chapter="${chapter.idx}">
          <span class="num">${String(chapter.idx).padStart(2, "0")}</span>
          <span class="name">${esc(chapter.title)}</span>
          <span class="size">${chapter.ideas} ${ideasWord(chapter.ideas)} · ${chapter.links} ${linksWord(chapter.links)}</span>
        </button>
      </li>`).join("");

    const keyMarkup = keyIdeas.length
      ? `<ul class="ideas">${keyIdeas.map((item) => `
          <li class="idea">
            <p class="idea-rank">
              <span class="rank-num">${String(item.rank).padStart(2, "0")}</span>
              <button class="idea-chapter" type="button" data-key-chapter="${item.chapter}">Глава ${String(item.chapter).padStart(2, "0")} · ${esc(item.chapter_title)}</button>
            </p>
            <p class="idea-text">${esc(item.idea)}</p>
            <blockquote>${esc(item.quote)}</blockquote>
            <p class="idea-why">${esc(item.why)}</p>
          </li>`).join("")}</ul>`
      : `<div class="empty">Ключевые идеи пока не выбраны.<br>
          Запустите <code>python3 app/key_ideas.py ${esc(id)}</code>, и они появятся здесь.</div>`;

    const summaryMarkup = summary
      ? `<p class="summary-about">${esc(summary.about)}</p>
         <ol class="summary-points">${summary.points.map((point) => `<li>${esc(point)}</li>`).join("")}</ol>`
      : `<div class="empty">Конспект пока не готов.<br>
          Запустите <code>python3 app/summary.py ${esc(id)}</code>, и он появится здесь.</div>`;

    app.innerHTML = `
      <button class="back" type="button" id="backBtn">← Библиотека</button>
      <section class="book-head">
        ${coverMarkup(book, "large")}
        <div class="book-info">
          <h1>${esc(book.title)}</h1>
          <p class="book-author">${esc(book.author || "Автор не указан")}</p>
          <div class="facts">
            <div class="fact"><b>${book.chapter_count}</b><span>${chaptersWord(book.chapter_count)}</span></div>
            <div class="fact"><b>${book.key_count}</b><span>${plural(book.key_count, "ключевая идея", "ключевые идеи", "ключевых идей")}</span></div>
            <div class="fact"><b>${book.link_count}</b><span>${linksWord(book.link_count)}</span></div>
            <div class="fact"><b>${book.contradiction_count}</b><span>${plural(book.contradiction_count, "противоречие", "противоречия", "противоречий")}</span></div>
            <div class="fact"><b>${esc((book.lang || "—").toUpperCase())}</b><span>язык</span></div>
          </div>
          ${summary ? `<p class="book-about">${esc(firstSentences(summary.about, 3))}</p>` : ""}
        </div>
      </section>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-book-view="chapters">Главы · ${book.chapter_count}</button>
        <button class="tab" type="button" role="tab" data-book-view="keys">Ключевые идеи · ${keyIdeas.length}</button>
        <button class="tab" type="button" role="tab" data-book-view="summary">Конспект</button>
      </div>
      <div class="chapters-pane"><ol class="chapters">${chapters}</ol></div>
      <div class="keys-pane">${keyMarkup}</div>
      <div class="summary-pane">${summaryMarkup}</div>`;

    document.getElementById("backBtn").addEventListener("click", () => { location.hash = ""; });
    app.querySelectorAll("[data-chapter]").forEach((row) => {
      row.addEventListener("click", () => {
        location.hash = "/book/" + id + "/chapter/" + row.dataset.chapter;
      });
    });
    app.querySelectorAll("[data-key-chapter]").forEach((button) => {
      button.addEventListener("click", () => {
        chapterView = "ideas";
        location.hash = "/book/" + id + "/chapter/" + button.dataset.keyChapter;
      });
    });

    const chaptersPane = app.querySelector(".chapters-pane");
    const keysPane = app.querySelector(".keys-pane");
    const summaryPane = app.querySelector(".summary-pane");
    const bookTabs = app.querySelectorAll("[data-book-view]");
    function setBookView(view) {
      bookView = view;
      bookTabs.forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.bookView === view)));
      chaptersPane.hidden = view !== "chapters";
      keysPane.hidden = view !== "keys";
      summaryPane.hidden = view !== "summary";
    }
    bookTabs.forEach((tab) => tab.addEventListener("click", () => setBookView(tab.dataset.bookView)));
    setBookView(bookView);
  }

  async function showChapter(id, idx) {
    const back = () => { location.hash = "/book/" + id; };
    app.innerHTML = `<button class="back" type="button" id="backBtn">← К списку глав</button><p class="hint">Открываю главу…</p>`;
    document.getElementById("backBtn").addEventListener("click", back);

    const chapterApi = "api/books/" + encodeURIComponent(id) + "/chapters/" + idx;
    let chapter, ideas;
    try {
      [chapter, ideas] = await Promise.all([api(chapterApi), api(chapterApi + "/ideas")]);
    } catch (error) {
      app.innerHTML = `<button class="back" type="button" id="backBtn">← К списку глав</button>
        <p class="note error">${esc(error.message)}</p>`;
      document.getElementById("backBtn").addEventListener("click", back);
      return;
    }

    const paragraphs = chapter.text.split("\n")
      .map((line) => line.trim())
      .filter(Boolean)
      .map((line) => `<p>${esc(line)}</p>`)
      .join("");

    const ideasMarkup = ideas.length
      ? `<ul class="ideas">${ideas.map((item) => `
          <li class="idea">
            <p class="idea-text"><a class="idea-link" href="#/idea/${item.id}">${esc(item.idea)}</a></p>
            <blockquote>${esc(item.quote)}</blockquote>
            <p class="idea-why">${esc(item.why)}</p>
          </li>`).join("")}</ul>`
      : `<div class="empty">У этой главы пока нет идей.<br>
          Запустите <code>python3 app/extract.py ${esc(id)} ${esc(idx)}</code>, и они появятся здесь.</div>`;

    app.innerHTML = `
      <button class="back" type="button" id="backBtn">← К списку глав</button>
      <article class="reader">
        <h1>${esc(chapter.title)}</h1>
        <div class="reader-meta">Глава ${String(chapter.idx).padStart(2, "0")} · ${number(chapter.text.length)} знаков</div>
        <div class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-view="text">Текст</button>
          <button class="tab" type="button" role="tab" data-view="ideas">Идеи · ${ideas.length}</button>
        </div>
        <div class="reader-text">${paragraphs}</div>
        <div class="ideas-pane">${ideasMarkup}</div>
      </article>`;
    document.getElementById("backBtn").addEventListener("click", back);

    const textPane = app.querySelector(".reader-text");
    const ideasPane = app.querySelector(".ideas-pane");
    const tabs = app.querySelectorAll(".tab");
    function setView(view) {

      ideasPane.hidden = view !== "ideas";
    }
    tabs.forEach((tab) => tab.addEventListener("click", () => setView(tab.dataset.view)));
    setView(chapterView);
  }

  const LINK_TYPES = {
    supports: "поддерживает",
    contradicts: "противоречит",
    extends: "развивает",
    example: "пример к",
    same: "то же самое",
  };

  function noteDate(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  }

  function notesMarkup(notes) {
    if (!notes.length) {
      return `<p class="hint">Пока пусто. Запишите мысль, вопрос или то, что хотите запомнить.</p>`;
    }
    return `<ul class="notes">${notes.map((note) => `
      <li class="note-item">
        <p class="note-text">${esc(note.text)}</p>
        <p class="note-meta">
          <span>${esc(noteDate(note.created))}</span>
          <button class="note-del" type="button" data-del="${note.id}">Удалить</button>
        </p>
      </li>`).join("")}</ul>`;
  }

  function bindNotes(ideaId, notes) {
    const list = document.getElementById("noteList");
    if (!list) return;
    list.innerHTML = notesMarkup(notes);
    list.querySelectorAll("[data-del]").forEach((button) => {
      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          await api("api/notes/" + button.dataset.del, { method: "DELETE" });
          notes = notes.filter((note) => String(note.id) !== button.dataset.del);
          bindNotes(ideaId, notes);
        } catch (error) {
          button.disabled = false;
          alert(error.message);
        }
      });
    });
  }
