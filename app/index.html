<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia — библиотека</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B4532A'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23FFF8F2' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<script>
  // Тему ставим до отрисовки: иначе в тёмной системе страница мигнёт белым.
  (function () {
    const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    try {
      document.documentElement.dataset.theme = localStorage.getItem("theme") || system;
    } catch (error) {
      document.documentElement.dataset.theme = system;
    }
  })();
</script>
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #FFFDF9;
    --ink: #1F1B16;
    --ink-muted: #6B6358;
    --line: #E4DCCC;
    --accent: #B4532A;
    --book-a: #8C6239;
    --book-b: #4F6B72;
    --book-c: #7A5C99;
    --book-d: #A0782E;
    --book-e: #5F7D3E;
    --book-f: #9A5B4F;
    --supports: #4F7A5A;
    --contradicts: #B23A48;
    --extends: #3D5A98;
    --example: #C08A2E;
    --same: #8A8278;
    --danger: #A32118;
    --focus: #8A3D1C;
    --shadow: 0 18px 40px -24px rgba(60, 45, 25, .45);
    --serif: "Times New Roman", Times, "Tinos", "Liberation Serif", serif;
    --sans: "Manrope", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #13110E;
    --surface: #1C1915;
    --ink: #EFE7DA;
    --ink-muted: #A79C8B;
    --line: #322C24;
    --accent: #D07A4E;
    --book-a: #B08155;
    --book-b: #6E8F97;
    --book-c: #9C82B8;
    --book-d: #C49A4A;
    --book-e: #7F9E5C;
    --book-f: #B47A6C;
    --supports: #6C9B78;
    --contradicts: #D15E6B;
    --extends: #6C86C4;
    --example: #D9A646;
    --same: #A39A8E;
    --danger: #F0938A;
    --focus: #E8A882;
    --shadow: 0 18px 40px -24px rgba(0, 0, 0, .7);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    transition: background .25s, color .25s;
  }
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 24px;
    padding: 14px 32px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: .02em;
  }
  .brand span { color: var(--accent); }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-link {
    padding: 7px 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--ink-muted);
    font-size: 14px;
    text-decoration: none;
  }
  .nav-link:hover { color: var(--ink); border-color: var(--line); }
  .nav-link.active { color: var(--ink); border-color: var(--line); background: var(--surface); }
  button.nav-link { background: none; font-family: inherit; cursor: pointer; }
  .icon-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-muted);
    font-size: 15px;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-muted); }
  /* Видимый фокус для клавиатуры на всём, что можно нажать. */
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 6px;
  }
  .nav-link:focus-visible, .icon-btn:focus-visible, .btn:focus-visible,
  .chip:focus-visible, [role="button"]:focus-visible { border-radius: 999px; outline-offset: 3px; }

  main { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 40px 32px 80px; }

  /* Поворот страницы: старый экран уходит листом, новый проявляется под ним. */
  .turn-sheet {
    position: fixed; z-index: 20;
    margin: 0 !important; max-width: none !important;
    overflow: hidden;
    background: var(--bg);
    transform-origin: left center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
    will-change: transform;
    box-shadow: -16px 0 48px rgba(31, 27, 22, .16);
  }
  html[data-theme="dark"] .turn-sheet { box-shadow: -16px 0 48px rgba(0, 0, 0, .55); }
  .turn-sheet::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(31, 27, 22, .20), rgba(31, 27, 22, .05) 16%, transparent 42%);
    animation: fold-shadow 620ms ease-out forwards;
  }
  html[data-theme="dark"] .turn-sheet::after {
    background: linear-gradient(90deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .18) 16%, transparent 42%);
  }
  .turn-sheet.turn-out {
    animation: turn-out-next 620ms cubic-bezier(.4, .04, .28, 1) forwards;
  }
  @keyframes turn-out-next {
    from { transform: perspective(1800px) rotateY(0deg); }
    to { transform: perspective(1800px) rotateY(-92deg); }
  }
  @keyframes fold-shadow { from { opacity: 1; } to { opacity: .0; } }
  #app.turn-in { animation: reveal 420ms ease-out; }
  @keyframes reveal {
    from { opacity: .35; transform: translateX(10px); }
    to { opacity: 1; transform: none; }
  }

  /* Бледные обложки на фоне страницы — как в макете. */
  .page-wm {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden;
    opacity: .05; filter: blur(2px);
    pointer-events: none; user-select: none;
  }
  html[data-theme="dark"] .page-wm { opacity: .07; }
  .page-wm.is-off { display: none; }
  .page-wm .wm-cover {
    position: absolute; display: block;
    border-radius: 16px; overflow: hidden;
    background: linear-gradient(160deg,
      color-mix(in srgb, var(--book) 80%, #fff) 0%,
      var(--book) 46%,
      color-mix(in srgb, var(--book) 68%, #000) 100%);
  }
  .page-wm .wm-cover::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 9%;
    background: linear-gradient(90deg, rgba(0, 0, 0, .22), transparent);
  }
  .page-wm .wm-cover span {
    position: absolute; left: 16%; right: 11%; bottom: 11%;
    font-family: var(--serif); font-weight: 700; line-height: 1.1;
    color: #FBF6EC;
  }
  .page-wm .wm-cover:nth-child(1) { width: 420px; height: 600px; top: -70px; right: -130px; font-size: 44px; transform: rotate(-7deg); }
  .page-wm .wm-cover:nth-child(2) { width: 300px; height: 430px; top: 360px; right: 150px; font-size: 28px; transform: rotate(6deg); }
  .page-wm .wm-cover:nth-child(3) { width: 220px; height: 315px; top: 520px; left: -70px; font-size: 21px; transform: rotate(-12deg); }
  .page-wm .wm-cover:nth-child(4) { width: 160px; height: 228px; top: 130px; left: 66px; font-size: 14px; transform: rotate(9deg); }

  .site-foot {
    position: relative; z-index: 1;
    max-width: 1120px; margin: 0 auto;
    padding: 0 32px 48px;
    color: var(--ink-muted); font-size: 13px;
  }
  .site-foot a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .site-foot a:hover { border-bottom-color: var(--accent); }
  main.map-main + .site-foot { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .turn-sheet, .turn-sheet::after, #app.turn-in { animation: none !important; display: none !important; }
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 42px;
    line-height: 1.15;
    margin: 0 0 8px;
  }
  .lead { color: var(--ink-muted); margin: 0 0 32px; max-width: 560px; }
  .upload {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 20px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    background: var(--surface);
    margin-bottom: 40px;
  }
  /* Один размер кнопок на всех экранах. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 40px;
    padding: 10px 18px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #FFF8F2;
    font: inherit;
    font-size: 14px;
    line-height: 1.2;
    cursor: pointer;
  }
  /* В тёмной теме акцент светлее: белые буквы на нём дают 3.0 — мало для AA. */
  html[data-theme="dark"] .btn { color: #1F1B16; }
  html[data-theme="dark"] .btn.ghost { color: var(--ink); }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .55; cursor: default; filter: none; }
  .btn.ghost {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  }
  .btn.ghost:hover { filter: none; border-color: var(--ink-muted); }
  .idea-actions {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 26px;
  }
  .idea-actions .back { margin-bottom: 0; }
  .hint { color: var(--ink-muted); font-size: 13px; }
  .note { font-size: 14px; }
  .note.error { color: var(--danger); }
  .ask-retry { margin-top: 12px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 30px 24px;
  }
  .card { text-align: left; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font: inherit; }
  .cover {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 6px 12px 12px 6px;
    background: linear-gradient(150deg, var(--book-a), var(--book-b));
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px 18px;
    color: #FBF6EC;
    transition: transform .2s;
  }
  .card:hover .cover { transform: translateY(-4px); }
  .cover::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 9px;
    background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.06) 60%, rgba(0,0,0,.12));
  }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover-title { position: relative; z-index: 1; font-family: var(--serif); font-size: 20px; line-height: 1.2; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .cover-author { position: relative; z-index: 1; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .9; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .card-title { margin: 14px 0 2px; font-family: var(--serif); font-size: 18px; }
  .card-meta { color: var(--ink-muted); font-size: 13px; }
  .card-links {
    display: inline-block; margin-top: 6px; padding: 1px 8px;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink-muted); font-size: 12px;
  }
  /* Плашка «Повторить: N карточек» на библиотеке. */
  .review-badge {
    display: inline-flex; align-items: baseline; gap: 10px; margin-top: 18px;
    padding: 10px 16px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    border-radius: 999px; background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    color: var(--ink); font-size: 14px; text-decoration: none;
  }
  .review-badge b { font-weight: 600; color: var(--accent); }
  .review-badge:hover { border-color: var(--accent); }
  /* «Связь дня» — самая уверенная связь, каждый день другая. */
  .link-day {
    margin: 28px 0 34px; padding: 20px 22px;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface);
  }
  .link-day-label {
    margin: 0 0 14px; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-muted);
  }
  .link-day-pair {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 18px; align-items: center;
  }
  .link-day-book { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .link-day-side h3 { margin: 4px 0 0; font-family: var(--serif); font-size: 17px; line-height: 1.35; }
  .link-day-quote {
    margin: 10px 0 0; padding: 8px 10px;
    border-left: 3px solid var(--line);
    background: var(--bg); border-radius: 0 8px 8px 0;
    font-family: var(--serif); font-size: 13.5px; line-height: 1.45;
  }
  .link-day-why {
    margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 13px; line-height: 1.45; color: var(--ink-muted);
  }
  .link-day-why b { color: var(--ink); font-weight: 600; }
  .link-day-actions {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 14px;
  }
  .link-day-mid {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12px; text-align: center; white-space: nowrap;
  }
  .link-day-mid .bridge-icon { font-size: 18px; }
  .link-day-mid b { font-size: 13px; }
  .link-day-more {
    display: inline-block; font-size: 13px;
    color: var(--ink-muted); text-decoration: none;
  }
  .link-day-more:hover { color: var(--ink); }
  @media (max-width: 560px) {
    .link-day-pair { grid-template-columns: 1fr; gap: 10px; }
    .link-day-mid { flex-direction: row; justify-content: flex-start; gap: 6px; }
  }
  .empty {
    padding: 48px 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    text-align: center;
    color: var(--ink-muted);
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 26px;
    border: 0; background: none; padding: 0;
    color: var(--ink-muted); font: inherit; font-size: 14px; cursor: pointer;
  }
  .back:hover { color: var(--ink); }
  .book-head { display: flex; gap: 36px; align-items: flex-start; margin-bottom: 44px; }
  .book-head .cover { width: 230px; flex: 0 0 230px; }
  .book-info h1 { font-size: 40px; }
  .book-author { margin: 0 0 18px; color: var(--ink-muted); font-size: 16px; }
  .facts { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .fact b { display: block; font-family: var(--serif); font-size: 22px; font-weight: 400; }
  .fact span { color: var(--ink-muted); font-size: 13px; }
  .book-about {
    margin: 20px 0 0; max-width: 64ch;
    color: var(--ink-muted); font-size: 15px; line-height: 1.65;
  }
  .book-extra { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 22px; margin-top: 16px; font-size: 13px; color: var(--ink-muted); }
  .book-extra a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .book-extra a:hover { border-bottom-color: var(--accent); }
  .book-delete {
    margin-left: auto; padding: 0; border: 0; background: none; font: inherit; font-size: 13px;
    color: var(--danger); cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
  }
  .book-delete:hover { border-bottom-color: var(--danger); }
  .book-delete:disabled { opacity: .5; cursor: default; }
  /* «О проекте»: проблема, решение, схема работы, приватность. */
  .about { max-width: 760px; }
  .about h2 { margin: 30px 0 8px; font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .about p { margin: 0 0 10px; line-height: 1.65; }
  .about-flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; margin: 16px 0 28px; padding: 0; list-style: none; }
  .about-step {
    flex: 1 1 118px; min-width: 118px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .about-step b { display: block; margin-bottom: 4px; font-family: var(--serif); font-size: 16px; }
  .about-step span { display: block; color: var(--ink-muted); font-size: 12px; line-height: 1.45; }
  .about-arrow { align-self: center; color: var(--ink-muted); font-size: 16px; }
  .about-link { margin: 28px 0 0; color: var(--ink-muted); font-size: 13px; }
  .about-link a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .note a { color: var(--accent); }
  .chapters { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .chapter-row {
    display: flex; align-items: baseline; gap: 16px;
    width: 100%; padding: 14px 4px;
    border: 0; border-bottom: 1px solid var(--line);
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .chapter-row:hover .name { color: var(--accent); }
  .chapters .num { flex: 0 0 34px; color: var(--ink-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .chapters .name { flex: 1; font-family: var(--serif); font-size: 19px; }
  .chapters .size { color: var(--ink-muted); font-size: 12px; white-space: nowrap; }
  .reader { max-width: 660px; }
  .reader h1 { font-size: 34px; margin: 0 0 6px; }
  .reader-meta { color: var(--ink-muted); font-size: 13px; margin-bottom: 30px; }
  .reader-text { font-family: var(--serif); font-size: 19px; line-height: 1.7; }
  .reader-text p { margin: 0 0 1.1em; }
  .tabs {
    display: inline-flex; gap: 4px; padding: 4px; margin: 0 0 26px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  .tab {
    border: 0; border-radius: 999px; background: none;
    color: var(--ink-muted); font: inherit; font-size: 13px;
    padding: 7px 16px; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--accent); color: #FFF8F2; }
  html[data-theme="dark"] .tab[aria-selected="true"] { color: #1C1915; }
  .ideas { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .idea {
    padding: 20px 22px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
  }
  .idea-text { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; line-height: 1.35; }
  .idea blockquote {
    margin: 0 0 12px; padding-left: 14px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 16px; line-height: 1.6;
    color: var(--ink-muted);
  }
  .idea-why { margin: 0; font-size: 13px; color: var(--ink-muted); }
  .idea-rank {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 10px; font-size: 12px; color: var(--ink-muted);
  }
  .rank-num { letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .idea-chapter {
    border: 0; background: none; padding: 0;
    font: inherit; color: var(--accent); cursor: pointer; text-align: left;
  }
  .idea-chapter:hover { text-decoration: underline; }
  .summary-about {
    margin: 0 0 26px; font-family: var(--serif); font-size: 20px; line-height: 1.5;
  }
  .summary-points {
    margin: 0; padding: 0 0 0 26px;
    font-size: 16px; line-height: 1.55;
  }
  .summary-points li { margin: 0 0 14px; padding-left: 4px; }
  .summary-points li::marker { color: var(--accent); font-variant-numeric: tabular-nums; }
  .section-title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px; }
  .idea-link { color: inherit; text-decoration: none; }
  .idea-link:hover { color: var(--accent); }
  .idea-link::after { content: " →"; color: var(--ink-muted); }
  .idea-page .idea-text { margin: 0 0 16px; }
  .idea-page blockquote,
  .link-card blockquote {
    margin: 0 0 12px; padding-left: 14px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 16px; line-height: 1.6;
    color: var(--ink-muted);
  }
  .idea-page .idea-why { margin-bottom: 30px; }
  .note-form { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: 0 0 18px; }
  .note-form textarea {
    width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface, transparent); color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1.5;
  }
  .note-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .notes { list-style: none; margin: 0 0 30px; padding: 0; display: flex; flex-direction: column; gap: 12px; }

  /* Поиск: окно поверх страницы, как в книгах — оглавление на просвет. */

<body>
<header class="top">

<main id="app"></main>

  <a href="#/about">О проекте</a> — как работает Marginalia и что происходит с вашими файлами.

<!-- Бледные обложки на фоне, как в макете. -->
<div class="page-wm" id="pageWm" aria-hidden="true">
  <span class="wm-cover" style="--book: var(--book-a)"><span>Думай медленно… решай быстро</span></span>

      <input type="search" id="searchInput" placeholder="Идея, цитата, книга, заметка…" autocomplete="off">
      <button class="search-close" id="searchClose" type="button" title="Закрыть (Esc)">✕</button>
    </div>

<input type="file" id="file" accept=".epub,.txt" hidden>
<script>
  const app = document.getElementById("app");
  const themeBtn = document.getElementById("themeBtn");
  const libLink = document.getElementById("libLink");
  const mapLink = document.getElementById("mapLink");
  const bridgesLink = document.getElementById("bridgesLink");
  const debateLink = document.getElementById("debateLink");
  const askLink = document.getElementById("askLink");
  const reviewLink = document.getElementById("reviewLink");
  const aboutLink = document.getElementById("aboutLink");
  const searchBtn = document.getElementById("searchBtn");
  const searchOverlay = document.getElementById("searchOverlay");
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  const searchClose = document.getElementById("searchClose");
  const fileInput = document.getElementById("file");

  // Адрес API — от каталога страницы, без имени файла: /proxy/8000/ или /proxy/8000/index.html
  // дают один и тот же /proxy/8000/api/... (раньше «index.html/api/books» давал 404).
  const proxyMatch = location.pathname.match(/^(.*\/proxy\/\d+\/)/);
  const pageBase = proxyMatch ? proxyMatch[1] : location.pathname.replace(/[^/]*$/, "");
  let chapterView = "text";  // какая вкладка открыта в читалке: текст или идеи
  let bookView = "chapters"; // какая вкладка открыта на странице книги: главы или ключевые идеи

  async function api(path, options) {
    let response;
    try {
      response = await fetch(pageBase + path, options);
    } catch {
      throw new Error("Нет связи с сервером. Проверьте, что сервер запущен, и попробуйте ещё раз.");
    }
    if (!response.ok) throw new Error((await response.text()) || ("Ошибка " + response.status));
    return response.json();
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // Архив для Obsidian: сервер собирает папку «Книги» и «Идеи» с [[ссылками]].
  async function exportMarkdown() {
    const button = document.getElementById("exportBtn");
    const note = document.getElementById("note");
    if (!button) return;
    button.disabled = true;
    const label = button.textContent;
    button.textContent = "Собираю…";
    try {
      const response = await fetch(pageBase + "api/export/markdown");
      if (!response.ok) throw new Error((await response.text()) || ("Ошибка " + response.status));
      downloadBlob(await response.blob(), "marginalia-markdown.zip");
      if (note) note.textContent = "Архив скачан: распакуйте папку и откройте её в Obsidian.";
    } catch (error) {
      if (note) note.textContent = "Не смог собрать архив: " + error.message;
    } finally {
      button.disabled = false;
      button.textContent = label;
    }
  }

  // Копирование: сначала буфер обмена, если браузер не даёт — старый способ.
  function copyText(button, text) {
    const label = button ? button.textContent : "";
    const done = () => {
      if (!button) return;
      button.textContent = "Скопировано";
      button.disabled = true;
      setTimeout(() => {
        button.textContent = label;
        button.disabled = false;
      }, 1600);
    };
    const failed = (error) => {
      if (button) button.textContent = "Не удалось скопировать";
      console.error(error);
    };
    const legacy = () => {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.top = "-1000px";
      document.body.appendChild(area);
      area.select();
      try {
        if (document.execCommand("copy")) done();
        else failed(new Error("Браузер не дал скопировать"));
      } catch (error) {
        failed(error);
      }
      area.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, legacy);
    } else {
      legacy();
    }
  }

  function markdownQuote(text) {
    return String(text || "").split("\n").map((line) => "> " + line).join("\n");
  }

  function plural(n, one, few, many) {
    const ten = n % 10, hundred = n % 100;
    if (ten === 1 && hundred !== 11) return one;
    if (ten >= 2 && ten <= 4 && (hundred < 12 || hundred > 14)) return few;
    return many;
  }

  function chaptersWord(n) { return plural(n, "глава", "главы", "глав"); }
  function ideasWord(n) { return plural(n, "идея", "идеи", "идей"); }
  function linksWord(n) { return plural(n, "связь", "связи", "связей"); }

  // Первые предложения конспекта — короткая выжимка справа от обложки.
  function firstSentences(text, limit) {
    const parts = String(text || "").match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [];
    return parts.slice(0, limit).join(" ").replace(/\s+/g, " ").trim();
  }

  function number(n) {
    return new Intl.NumberFormat("ru-RU").format(n);
  }

  function coverMarkup(book, extraClass) {
    if (book.cover) {
      return `<div class="cover ${extraClass || ""}">
        <img src="${esc(pageBase)}covers/${encodeURIComponent(book.cover)}" alt="Обложка: ${esc(book.title)}">
      </div>`;
    }
    return `<div class="cover ${extraClass || ""}">
      <div class="cover-title">${esc(book.title)}</div>
      <div class="cover-author">${esc(book.author || "Без автора")}</div>
    </div>`;
  }

  function showAbout() {
    const steps = [
      ["Книга", "EPUB или TXT до 100 МБ, разбор на главы"],
      ["Идеи", "модель выписывает главные мысли с цитатой"],
      ["Проверка цитат", "цитата сверяется с текстом главы"],
      ["Связи", "идеи разных книг: согласие, продолжение, спор"],
      ["Карта", "вся библиотека на одной карте"]
    ];
    app.innerHTML = `
      <button class="back" type="button" id="backBtn">← Библиотека</button>
      <section class="about">
        <h1>О проекте</h1>
        <p class="lead">Marginalia — читательский дневник, который сам находит в книгах идеи и показывает, где авторы согласны, а где спорят.</p>

        <h2>Проблема</h2>
        <p>Книги читаются одна за другой, а через месяц остаётся только обложка. Идеи растворяются, цитаты теряются, а связи между книгами — то, что один автор уже сказал то же самое или наоборот спорит, — никто не держит в голове.</p>

        <h2>Решение</h2>
        <p>Marginalia разбирает каждую книгу на идеи с дословными цитатами, соединяет похожие и противоположные мысли из разных книг и даёт повторять карточки, пока идеи не останутся в памяти.</p>

        <h2>Как это работает</h2>
        <ol class="about-flow">${steps.map(([title, text], index) =>
          (index ? '<li class="about-arrow" aria-hidden="true">→</li>' : "") +
          `<li class="about-step"><b>${esc(title)}</b><span>${esc(text)}</span></li>`
        ).join("")}</ol>
        <p>Каждая цитата ищется в тексте главы; если её там нет, идея отбрасывается, а сама цитата берётся из книги — так в карточках не бывает выдуманных строк. Ключевые идеи, конспект и споры авторов можно перепроверить на вкладках книги.</p>

        <h2>Приватность</h2>
        <p>Библиотека — книги, идеи, заметки, оценки — лежит в одном файле на сервере проекта (<code>data/library.db</code>). Никаких аккаунтов, рекламы и счётчиков посещений.</p>
        <p>В модель уходят только фрагменты текста, нужные для разбора: одна глава или список идей. Вся библиотека целиком никуда не отправляется.</p>
        <p>Удаление книги стирает и её главы, идеи, связи, заметки, карточки повторения и обложку.</p>
      </section>`;
    document.getElementById("backBtn").addEventListener("click", () => { location.hash = ""; });
  }

  function showLibrary() {

  // Самая уверенная связь дня: из нескольких самых сильных выбираем одну
  // по номеру дня, поэтому назавтра будет другая.
  function linkOfDay(links, byId) {
    const sorted = links
      .filter((link) => byId.has(Number(link.from_id)) && byId.has(Number(link.to_id)))
      .sort((a, b) => Number(b.confidence) - Number(a.confidence) || a.from_id - b.from_id);
    if (!sorted.length) return null;
    // Берём только сильные связи; если таких совсем мало — первые по уверенности.
    const strong = sorted.filter((link) => Number(link.confidence) >= STRONG_CONF);
    const pool = strong.length > 1 ? strong : sorted.slice(0, 5);
    const day = Math.floor(Date.now() / 86400000);
    return pool[day % pool.length];
  }

  function linkDayMarkup(graph) {
    const byId = new Map(graph.ideas.map((idea) => [Number(idea.id), idea]));
    const link = linkOfDay(graph.links, byId);
    if (!link) return "";
    const first = byId.get(Number(link.from_id));
    const second = byId.get(Number(link.to_id));
    const style = LINK_STYLES[link.type] || LINK_STYLES.same;
    const side = (idea) => '<div class="link-day-side">'
      + '<span class="link-day-book">' + esc(shortText(idea.book_title, 32)) + '</span>'
      + '<h3>' + esc(idea.title || shortText(idea.idea, 80)) + '</h3>'
      + (idea.quote ? '<blockquote class="link-day-quote">«' + esc(idea.quote) + '»</blockquote>' : "")
      + '</div>';
    return '<section class="link-day">'
      + '<p class="link-day-label">Связь дня</p>'
      + '<div class="link-day-pair">'
      + side(first)
      + '<div class="link-day-mid" style="color:' + style.color + '">'
      + '<span class="bridge-icon">' + style.icon + '</span>'
      + '<span>' + esc(LINK_TYPES[link.type] || link.type) + '</span>'
      + '<b>' + Math.round(Number(link.confidence) * 100) + '%</b>'
      + '</div>'
      + side(second)
      + '</div>'
      + (link.explanation
        ? '<p class="link-day-why"><b>Почему связаны:</b> ' + esc(link.explanation) + '</p>'
        : "")
      + '<div class="link-day-actions">'
      + '<button type="button" class="bridge-open" data-open-pair="'
      + link.from_id + '-' + link.to_id + '">Открыть на карте →</button>'
      + '<a class="link-day-more" href="#/bridges">Все мосты →</a>'
      + '</div>'
      + '</section>';
  }
