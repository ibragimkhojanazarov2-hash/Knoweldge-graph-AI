  // --- карта идей ---
  const LINK_STYLES = {
    supports: { color: "var(--supports)", dash: "", icon: "✓" },
    contradicts: { color: "var(--contradicts)", dash: "7 5", icon: "⚔" },
    extends: { color: "var(--extends)", dash: "", icon: "➕" },
    example: { color: "var(--example)", dash: "1 4", icon: "📌" },
    same: { color: "var(--same)", dash: "2 5", icon: "=" },
  };

  // Толщина линии — уверенность связи: 0.6 тонкая, 0.95 толстая.
  function edgeWidth(confidence) {
    const t = Math.max(0, Math.min(1, (Number(confidence) - 0.6) / 0.35));
    return (1.2 + t * 3.6).toFixed(2);
  }
  const BOOK_VARS = ["--book-a", "--book-b", "--book-c", "--book-d", "--book-e", "--book-f"];
  // Карта рисуется в пикселях холста: так подписи остаются настоящего
  // размера (14px) при любом экране, а не уменьшаются вместе с картинкой.
  let mapSize = { w: 1000, h: 720 };

  const MAP_MARGIN = 18;  // поля по краям карты
  const COL_GAP = 170;    // место между колонками книг — там идут дуги
  const HEAD_H = 108;     // обложка и название книги над колонкой
  const TOOLS_H = 64;     // нижняя полоса под панель кнопок: подписи туда не заходят
  const STRONG_CONF = 0.85;  // «только сильные связи»: явная связь и выше

  let mapState = null;  // данные карты и настройки фильтров
  let mapView = { x: 0, y: 0, scale: 1 };
  let mapEditing = false;
  let mapDrag = null;
  let mapMoved = 0;
  let mapResizeBound = false;

  /** Порядок идей внутри колонки: у связанных идей похожая высота. */
  function orderColumns(ideas, links, bookIds) {
    const byId = new Map(ideas.map((idea) => [Number(idea.id), idea]));
    const partners = new Map(ideas.map((idea) => [Number(idea.id), []]));
    links.forEach((link) => {
      const from = Number(link.from_id);
      const to = Number(link.to_id);
      if (partners.has(from)) partners.get(from).push(to);
      if (partners.has(to)) partners.get(to).push(from);
    });
    const order = new Map(bookIds.map((bookId) => [
      bookId,
      ideas.filter((idea) => idea.book_id === bookId).slice()
        .sort((a, b) => Number(a.id) - Number(b.id)),
    ]));
    const rank = new Map();
    const rerank = () => {
      order.forEach((list) => list.forEach((idea, index) => {
        rank.set(Number(idea.id), list.length > 1 ? index / (list.length - 1) : 0.5);
      }));
    };
    rerank();
    for (let pass = 0; pass < 6; pass += 1) {
      order.forEach((list, bookId) => {
        const scored = list.map((idea, index) => {
          const own = rank.get(Number(idea.id));
          const others = (partners.get(Number(idea.id)) || []).filter((id) => {
            const other = byId.get(id);
            return other && other.book_id !== bookId;
          });
          const mean = others.length
            ? others.reduce((sum, id) => sum + (rank.get(id) ?? own), 0) / others.length
            : own;
          return { idea, index, score: mean * 0.75 + own * 0.25 };
        });
        scored.sort((a, b) => a.score - b.score || a.index - b.index);
        order.set(bookId, scored.map((item) => item.idea));
      });
      rerank();
    }
    return order;
  }

  let mapMeasure = null;  // холст для точной ширины подписи в пикселях

  /** Обрезает подпись по настоящей ширине шрифта, а не по числу букв. */
  function labelFitter(limitPx) {
    if (!mapMeasure) {
      mapMeasure = document.createElement("canvas").getContext("2d");
      const sans = getComputedStyle(document.documentElement)
        .getPropertyValue("--sans").trim();
      mapMeasure.font = '14px ' + (sans || "sans-serif");
    }
    return (text) => {
      const full = String(text || "").replace(/\s+/g, " ").trim();
      if (!full || mapMeasure.measureText(full).width <= limitPx) return full;
      let low = 0;
      let high = full.length;
      while (low < high) {
        const mid = Math.ceil((low + high) / 2);
        if (mapMeasure.measureText(full.slice(0, mid) + "…").width <= limitPx) low = mid;
        else high = mid - 1;
      }
      return full.slice(0, Math.max(1, low)).replace(/[\s,;:.—-]+$/, "") + "…";
    };
  }

  /** Колонки книг: идеи друг под другом, подписи сбоку от точки. */
  function layoutColumns(ideas, links, width, height, bookOrder) {
    // Колонки идут в порядке добавления книг в библиотеку, а не в порядке идей:
    // «Зеленый свет» слева, «Черновик» справа, как договорились.
    const present = new Set(ideas.map((idea) => idea.book_id));
    const bookIds = bookOrder.filter((bookId) => present.has(bookId));
    present.forEach((bookId) => {
      if (!bookIds.includes(bookId)) bookIds.push(bookId);
    });
    const order = orderColumns(ideas, links, bookIds);
    const counts = new Map(bookIds.map((bookId) => [bookId, order.get(bookId).length]));

    // Телефон: колонки рядом не помещаются, подписи уезжают за край.
    // Книги идут друг под другом, точки у левого края, подпись — во всю ширину.
    if (width < 700) {
      const HEAD_STACK = 46;   // обложка и название книги над её идеями
      const BOOK_GAP = 18;     // воздух между книгами
      const totalRows = Math.max(1, [...counts.values()].reduce((sum, n) => sum + n, 0));
      const avail = Math.max(120, height - MAP_MARGIN - bookIds.length * (HEAD_STACK + BOOK_GAP));
      const rowH = Math.max(18, Math.min(30, avail / totalRows));
      const dotX = MAP_MARGIN + 16;
      const positions = new Map();
      const columns = [];
      let y = MAP_MARGIN + 6;
      bookIds.forEach((bookId) => {
        const list = order.get(bookId);
        const fitLabel = labelFitter(Math.max(80, width - MAP_MARGIN - dotX - 22));
        columns.push({
          bookId, stacked: true, top: y, left: MAP_MARGIN, width: width - MAP_MARGIN * 2,
          center: width / 2, dotX, outward: 1,
          titleLimit: Math.max(8, Math.round((width - MAP_MARGIN * 2 - 44) / 8.5)),
        });
        y += HEAD_STACK;
        list.forEach((idea, row) => {
          positions.set(Number(idea.id), {
            x: dotX, y: y + rowH * (row + 0.5), row, rowH,
            labelX: dotX + 16, anchor: "start", below: false,
            label: fitLabel(idea.title || idea.idea),
          });
        });
        y += list.length * rowH + BOOK_GAP;
      });
      const contentH = Math.max(height, Math.round(y - BOOK_GAP + MAP_MARGIN));
      return { positions, columns, counts, rowH, contentH, stacked: true };
    }

    const maxRows = Math.max(1, ...bookIds.map((id) => order.get(id).length));
    const avail = Math.max(120, height - HEAD_H - MAP_MARGIN);
    // Строка не ниже 22px: подпись 14px иначе налезает на соседнюю.
    const rowH = Math.max(18, Math.min(74, avail / maxRows));
    const contentH = Math.max(height, HEAD_H + rowH * maxRows + MAP_MARGIN);
    const usable = Math.max(240, width - MAP_MARGIN * 2 - COL_GAP * Math.max(0, bookIds.length - 1));
    const colW = usable / Math.max(bookIds.length, 1);
    const positions = new Map();
    const columns = [];
    bookIds.forEach((bookId, index) => {
      const list = order.get(bookId);
      const left = MAP_MARGIN + index * (colW + COL_GAP);
      const center = left + colW / 2;
      const outward = center < width / 2 - 1 ? -1 : center > width / 2 + 1 ? 1 : 0;
      const dotX = outward === 0 ? center : center - outward * (colW / 2 - 16);
      const blockTop = HEAD_H + Math.max(0, (avail - rowH * list.length) / 2);
      // Сколько места есть у подписи до края холста — туда она и должна влезть.
      const labelSpace = outward === 0
        ? Math.max(60, colW - 24)
        : outward < 0
          ? Math.max(60, dotX - 14 - MAP_MARGIN)
          : Math.max(60, width - MAP_MARGIN - dotX - 14);
      const fitLabel = labelFitter(labelSpace);
      columns.push({
        bookId, left, center, dotX, outward, top: blockTop, width: colW,
        titleLimit: Math.max(8, Math.round((colW - 12) / 8.5)),
      });
      list.forEach((idea, row) => {
        const y = blockTop + rowH * (row + 0.5);
        positions.set(Number(idea.id), {
          x: dotX, y, row, rowH,
          labelX: outward === 0 ? dotX : dotX + outward * 14,
          anchor: outward === 0 ? "middle" : (outward < 0 ? "end" : "start"),
          below: outward === 0,
          label: fitLabel(idea.title || idea.idea),
        });
      });
    });
    return { positions, columns, counts, rowH, contentH };
  }

  function makeMapState(graph, allLoaded) {
    const colorOf = new Map();
    graph.books.forEach((book, index) => {
      colorOf.set(book.id, "var(" + BOOK_VARS[index % BOOK_VARS.length] + ")");
    });
    const byId = new Map(graph.ideas.map((idea) => [Number(idea.id), idea]));
    const links = graph.links.filter(
      (link) => byId.has(Number(link.from_id)) && byId.has(Number(link.to_id))
    );
    return {
      graph,
      links,
      colorOf,
      bookIds: new Set(graph.books.map((book) => book.id)),
      types: new Set(Object.keys(LINK_STYLES)),
      strongOnly: false,
      labels: graph.ideas.length <= 60,
      allLoaded: Boolean(allLoaded),
      loading: false,
      selected: null,
      selectedLink: null,
    };
  }

  function visibleMap() {
    const state = mapState;
    const ideas = state.graph.ideas.filter((idea) => state.bookIds.has(idea.book_id));
    const ideaIds = new Set(ideas.map((idea) => Number(idea.id)));
    const links = state.links.filter(
      (link) =>
        state.types.has(link.type) &&
        (!state.strongOnly || Number(link.confidence) >= STRONG_CONF) &&
        ideaIds.has(Number(link.from_id)) &&
        ideaIds.has(Number(link.to_id))
    );
    const degree = new Map();
    links.forEach((link) => {
      const from = Number(link.from_id);
      const to = Number(link.to_id);
      degree.set(from, (degree.get(from) || 0) + 1);
      degree.set(to, (degree.get(to) || 0) + 1);
    });
    // Сузили типы или уверенность — идеи без видимой связи с карты уходят.
    // Выбор книг и «Показать все идеи» оставляют идеи на месте: у одной книги
    // межкнижных связей нет, и пустая карта тут ничего не объясняет.
    const narrowed = state.types.size < Object.keys(LINK_STYLES).length || state.strongOnly;
    const shown = !state.allLoaded && narrowed
      ? ideas.filter((idea) => degree.has(Number(idea.id)))
      : ideas;
    return { ideas: shown, links, degree };
  }

  function nodeRadius(degree) {
    return 6 + Math.min(5, Math.sqrt(degree) * 1.9);
  }

  function shortText(text, limit) {
    const clean = String(text || "").trim();
    return clean.length > limit ? clean.slice(0, limit).trimEnd() + "…" : clean;
  }

  function filtersMarkup(ideas, links) {
    const state = mapState;
    // Числа в фильтрах — про то, что сейчас на карте: идей у книги и связей
    // у типа после выбора книг и порога уверенности.
    const bookCount = new Map();
    ideas.forEach((idea) => {
      bookCount.set(idea.book_id, (bookCount.get(idea.book_id) || 0) + 1);
    });
    const bookOf = new Map(state.graph.ideas.map((idea) => [Number(idea.id), idea.book_id]));
    const typeCount = new Map();
    state.links.forEach((link) => {
      if (state.strongOnly && Number(link.confidence) < STRONG_CONF) return;
      if (!state.bookIds.has(bookOf.get(Number(link.from_id)))) return;
      if (!state.bookIds.has(bookOf.get(Number(link.to_id)))) return;
      typeCount.set(link.type, (typeCount.get(link.type) || 0) + 1);
    });
    const bookRows = state.graph.books.map((book) => (
      '<label class="frow"><input type="checkbox" data-book="' + esc(book.id) + '"'
      + (state.bookIds.has(book.id) ? " checked" : "")
      + '><span class="fdot" style="background:' + state.colorOf.get(book.id) + '"></span>'
      + '<span>' + esc(shortText(book.title, 22)) + '</span>'
      + '<span class="fcount">' + (bookCount.get(book.id) || 0) + '</span></label>'
    )).join("");
    const typeRows = Object.keys(LINK_STYLES).map((type) => {
      const style = LINK_STYLES[type];
      const borderStyle = style.dash === "7 5" ? "dashed" : style.dash ? "dotted" : "solid";
      return '<label class="frow"><input type="checkbox" data-type="' + type + '"'
        + (state.types.has(type) ? " checked" : "")
        + '><span class="fline" style="border-top-color:' + style.color
        + ";border-top-style:" + borderStyle + '"></span>'
        + '<span>' + LINK_TYPES[type] + '</span>'
        + '<span class="fcount">' + (typeCount.get(type) || 0) + '</span></label>';
    }).join("");
    return ''
      + '<h2>Карта идей</h2>'
      + '<p class="count" id="mapCount"></p>'
      + '<div class="fgroup"><p class="fgroup-title">Книги</p>' + bookRows + '</div>'
      + '<div class="fgroup"><p class="fgroup-title">Типы связей</p>' + typeRows + '</div>'
      + '<div class="fgroup"><label class="frow"><input type="checkbox" id="strongOnly"'
      + (state.strongOnly ? " checked" : "")
      + '><span>Только сильные связи</span><span class="fcount">≥ '
      + Math.round(STRONG_CONF * 100) + '%</span></label>'
      + '<p class="fnote">Слабая тематическая перекличка остаётся за пределами карты.</p>'
      + '</div>'
      + '<div class="fgroup"><label class="frow"><input type="checkbox" id="allIdeas"'
      + (state.allLoaded ? " checked" : "") + (state.loading ? " disabled" : "")
      + '><span>Показать все идеи</span></label>'
      + '</div>';
  }

  /** Обложка и название книги над колонкой. */
  function headersMarkup(layout) {
    const books = new Map(mapState.graph.books.map((book) => [book.id, book]));
    return layout.columns.map((col) => {
      const book = books.get(col.bookId) || { id: col.bookId, title: col.bookId, cover: null };
      const color = mapState.colorOf.get(col.bookId) || "var(--book-a)";
      // На телефоне книга — строкой: обложка слева, название и число идей рядом.
      if (col.stacked) {
        const coverW = 26;
        const coverH = 36;
        const textX = MAP_MARGIN + coverW + 10;
        const cover = book.cover
          ? '<image href="' + esc(pageBase) + 'covers/' + encodeURIComponent(book.cover)
            + '" x="' + MAP_MARGIN + '" y="' + (col.top + 1) + '" width="' + coverW
            + '" height="' + coverH + '" preserveAspectRatio="xMidYMid meet"/>'
          : '<rect x="' + MAP_MARGIN + '" y="' + (col.top + 1) + '" width="' + coverW
            + '" height="' + coverH + '" rx="3" fill="' + color + '" opacity=".35"/>'
            + '<text class="map-head-initial" x="' + (MAP_MARGIN + coverW / 2)
            + '" y="' + (col.top + 26) + '" text-anchor="middle">'
            + esc(String(book.title || "?").slice(0, 1)) + '</text>';
        return '<g class="map-head" data-book="' + esc(col.bookId) + '">' + cover
          + '<text class="map-head-title" x="' + textX + '" y="' + (col.top + 16)
          + '">' + esc(shortText(book.title, col.titleLimit)) + '</text>'
          + '<text class="map-head-count" x="' + textX + '" y="' + (col.top + 32)
          + '">' + layout.counts.get(col.bookId) + ' идей</text></g>';
      }
      const coverW = 44;
      const coverH = 62;
      const cover = book.cover
        ? '<image href="' + esc(pageBase) + 'covers/' + encodeURIComponent(book.cover)
          + '" x="' + (col.center - coverW / 2).toFixed(1) + '" y="10" width="' + coverW
          + '" height="' + coverH + '" preserveAspectRatio="xMidYMid meet"/>'
        : '<rect x="' + (col.center - coverW / 2).toFixed(1) + '" y="10" width="' + coverW
          + '" height="' + coverH + '" rx="4" fill="' + color + '" opacity=".35"/>'
          + '<text class="map-head-initial" x="' + col.center.toFixed(1)
          + '" y="50" text-anchor="middle">' + esc(String(book.title || "?").slice(0, 1)) + '</text>';
      return '<g class="map-head" data-book="' + esc(col.bookId) + '">' + cover
        + '<text class="map-head-title" x="' + col.center.toFixed(1) + '" y="95" text-anchor="middle">'
        + esc(shortText(book.title, col.titleLimit)) + '</text>'
        + '<text class="map-head-count" x="' + col.center.toFixed(1) + '" y="108" text-anchor="middle">'
        + layout.counts.get(col.bookId) + ' идей</text></g>';
    }).join("");
  }

  function mapShapes(layout) {
    const state = mapState;
    const { ideas, links, degree } = visibleMap();
    const shownIds = new Set(ideas.map((idea) => Number(idea.id)));
    const selected = state.selected && shownIds.has(state.selected) ? state.selected : null;
    const pair = state.selectedLink;
    const pairOn = pair && shownIds.has(Number(pair.from)) && shownIds.has(Number(pair.to))
      ? { from: Number(pair.from), to: Number(pair.to) }
      : null;
    const neighbors = new Set();
    if (selected) {
      neighbors.add(selected);
      links.forEach((link) => {
        const from = Number(link.from_id);
        const to = Number(link.to_id);
        if (from === selected) neighbors.add(to);
        if (to === selected) neighbors.add(from);
      });
    }
    // Значок типа стоит в середине дуги. Но связи сходятся к середине зазора,
    // и значки наезжали друг на друга: поэтому для каждой дуги пробуем
    // середину, а если место занято — точки вдоль дуги ближе к концам.
    const BADGE_T = [0.5, 0.4, 0.6, 0.3, 0.7, 0.24, 0.76, 0.18, 0.82];
    const placed = [];
    const edgeParts = [];
    let edgeIndex = 0;
    links.forEach((link) => {
      const from = Number(link.from_id);
      const to = Number(link.to_id);
      const a = layout.positions.get(from);
      const b = layout.positions.get(to);
      if (!a || !b) return;
      const style = LINK_STYLES[link.type] || LINK_STYLES.same;
      const r1 = nodeRadius(degree.get(from) || 0) + 1;
      const r2 = nodeRadius(degree.get(to) || 0) + 2;
      const onPair = pairOn && ((from === pairOn.from && to === pairOn.to)
        || (from === pairOn.to && to === pairOn.from));
      const dim = selected
        ? from !== selected && to !== selected
        : pairOn ? !onPair : false;
      // Дуга выходит из точки горизонтально и так же входит в соседнюю:
      // между колонками это читается как плавная связь, а не как клубок.
      // Когда книги стоят друг под другом (телефон), дуга идёт сверху вниз.
      const upright = Math.abs(b.y - a.y) > Math.abs(b.x - a.x) * 1.6;
      let p0, p1, p2, p3;
      if (upright) {
        // Связей между книгами много, поэтому дуги идут тремя рядами
        // по левому полю и выходят из точки сбоку, не задевая соседние.
        const lane = edgeIndex % 3;
        const bow = Math.max(4, Math.min(a.x, b.x) - 20 - lane * 6);
        p0 = { x: a.x - r1, y: a.y };
        p1 = { x: bow, y: a.y };
        p2 = { x: bow, y: b.y };
        p3 = { x: b.x - r2, y: b.y };
      } else {
        const sign = b.x >= a.x ? 1 : -1;
        const x1 = a.x + sign * r1;
        const x2 = b.x - sign * r2;
        const c1 = x1 + (x2 - x1) * 0.42;
        const c2 = x2 - (x2 - x1) * 0.42;
        p0 = { x: x1, y: a.y };
        p1 = { x: c1, y: a.y };
        p2 = { x: c2, y: b.y };
        p3 = { x: x2, y: b.y };
      }
      const at = (t) => {
        const u = 1 - t;
        return {
          x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
          y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y,
        };
      };
      let spot = null;
      for (const t of BADGE_T) {
        const point = at(t);
        if (placed.every((p) => Math.hypot(p.x - point.x, p.y - point.y) >= 20)) {
          spot = point;
          break;
        }
      }
      if (!spot) spot = at(0.5);
      placed.push(spot);
      const d = "M" + p0.x.toFixed(1) + " " + p0.y.toFixed(1)
        + " C" + p1.x.toFixed(1) + " " + p1.y.toFixed(1)
        + ", " + p2.x.toFixed(1) + " " + p2.y.toFixed(1)
        + ", " + p3.x.toFixed(1) + " " + p3.y.toFixed(1);
      edgeParts.push(
        '<g class="map-edge' + (dim ? " dim" : "") + (onPair ? " sel" : "")
        + '" data-edge="' + from + "-" + to + '"'
        + ' data-conf="' + link.confidence + '">'
        + '<path d="' + d + '" stroke="transparent" stroke-width="16" fill="none"/>'
        + '<path d="' + d + '"'
        + ' stroke="' + style.color + '" stroke-width="' + edgeWidth(link.confidence) + '"'
        + (style.dash ? ' stroke-dasharray="' + style.dash + '"' : "")
        + ' opacity=".8"/>'
        + '<circle class="map-edge-badge" cx="' + spot.x.toFixed(1) + '" cy="' + spot.y.toFixed(1)
        + '" r="8.5" stroke="' + style.color + '"/>'
        + '<text class="map-edge-icon" x="' + spot.x.toFixed(1) + '" y="' + spot.y.toFixed(1)
        + '" fill="' + style.color + '">' + style.icon + '</text>'
        + '</g>'
      );
      edgeIndex += 1;
    });
    const nodeParts = ideas.map((idea) => {
      const id = Number(idea.id);
      const point = layout.positions.get(id);
      if (!point) return "";
      const radius = nodeRadius(degree.get(id) || 0);
      const color = state.colorOf.get(idea.book_id) || "var(--book-a)";
      const verdict = idea.verdict === "right" || idea.verdict === "wrong"
        ? ' style="stroke:var(--' + (idea.verdict === "right" ? "supports" : "contradicts")
          + ');stroke-width:2.5"'
        : "";
      const dim = selected
        ? !neighbors.has(id)
        : pairOn ? id !== pairOn.from && id !== pairOn.to : false;
      const isSel = id === selected || Boolean(pairOn && (id === pairOn.from || id === pairOn.to));
      const label = state.labels
        ? '<text class="map-label" x="' + (point.labelX - point.x).toFixed(1) + '"'
          + ' y="' + (point.below ? radius + 18 : 5) + '" text-anchor="' + point.anchor + '">'
          + esc(point.label) + '</text>'
        : "";
      return '<g class="map-node' + (isSel ? " sel" : "") + (dim ? " dim" : "")
        + '" data-id="' + id + '" transform="translate(' + point.x.toFixed(1) + ","
        + point.y.toFixed(1) + ')"><title>' + esc(idea.idea) + '</title>'
        + '<circle r="' + radius.toFixed(1) + '" fill="' + color + '"' + verdict + '/>'
        + label + '</g>';
    });
    return edgeParts.join("") + nodeParts.join("");
  }

  function renderMapScreen() {
    const state = mapState;
    const { ideas, links } = visibleMap();
    const open = app.querySelector(".map-screen")?.classList.contains("filters-open");
    app.innerHTML = ''
      + '<div class="map-screen' + (open ? " filters-open" : "") + '" id="mapScreen">'
      + '<aside class="map-filters" id="mapFilters">' + filtersMarkup(ideas, links) + '</aside>'
      + '<div class="map-main">'
      + '<div class="map-canvas" id="mapCanvas">'
      + '<svg id="mapSvg" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Карта идей">'
      + '<g id="mapWorld"></g>'
      + '</svg>'
      + (ideas.length
        ? (links.length ? "" : '<div class="map-empty">Все связи скрыты фильтрами — остались только идеи.</div>')
        : '<div class="map-empty">Под фильтры ничего не подошло.</div>')
      + '<aside class="map-panel" id="mapPanel" hidden></aside>'
      + '</div>'
      + '<div class="map-tools">'
      + '<button type="button" id="filtersBtn" title="Фильтры">Фильтры</button>'
      + '<button type="button" id="zoomIn" title="Приблизить">+</button>'
      + '<button type="button" id="zoomOut" title="Отдалить">−</button>'
      + '<button type="button" id="zoomReset" class="wide" title="Показать всю карту">Сброс</button>'
      + '<label><input type="checkbox" id="labelsToggle"' + (state.labels ? " checked" : "")
      + '> Подписи</label>'
      + '</div>'
      + '</div></div>';
    const count = document.getElementById("mapCount");
    if (count) {
      count.textContent = "идей " + ideas.length + " · связей " + links.length
        + (state.allLoaded ? " · все идеи" : "");
    }

    // Второй шаг: узнаём размер холста и раскладываем колонки в пикселях.
    // viewBox равен размеру в пикселях, поэтому подписи 14px видны настоящими.
    const canvas = document.getElementById("mapCanvas");
    const svg = document.getElementById("mapSvg");
    const world = document.getElementById("mapWorld");
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(320, Math.round(rect.width));
    const height = Math.max(320, Math.round(rect.height));
    const bookOrder = mapState.graph.books.map((book) => book.id);
    const layout = layoutColumns(ideas, links, width, height, bookOrder);
    mapSize = { w: width, h: layout.contentH };
    svg.setAttribute("viewBox", "0 0 " + width + " " + layout.contentH);
    svg.style.height = layout.contentH + "px";
    world.innerHTML = headersMarkup(layout) + mapShapes(layout);

    applyView();
    bindMap();
    renderPanel();
    bindMapResize();
  }

  /** Перекладка при повороте экрана или смене размера окна. */
  function bindMapResize() {
    if (mapResizeBound) return;
    mapResizeBound = true;
    let timer = null;
    window.addEventListener("resize", () => {
      if (!document.getElementById("mapCanvas")) return;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!document.getElementById("mapCanvas")) return;
        renderMapScreen();
      }, 150);
    });
  }

  function applyView() {
    const world = document.getElementById("mapWorld");
    if (world) {
      world.setAttribute("transform", "translate(" + mapView.x + " " + mapView.y
        + ") scale(" + mapView.scale + ")");
    }
  }

  function zoomAt(factor) {
    const next = Math.min(3.2, Math.max(0.6, mapView.scale * factor));
    const ratio = next / mapView.scale;
    mapView.x = mapSize.w / 2 - (mapSize.w / 2 - mapView.x) * ratio;
    mapView.y = mapSize.h / 2 - (mapSize.h / 2 - mapView.y) * ratio;
    mapView.scale = next;
    applyView();
  }

  function bindMap() {
    const svg = document.getElementById("mapSvg");
    const screen = document.getElementById("mapScreen");
    const filters = document.getElementById("mapFilters");

    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(1.25));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(1 / 1.25));
    document.getElementById("zoomReset").addEventListener("click", () => {
      mapView = { x: 0, y: 0, scale: 1 };
      applyView();
    });
    document.getElementById("filtersBtn").addEventListener("click", () => {
      screen.classList.toggle("filters-open");
    });
    document.getElementById("labelsToggle").addEventListener("change", (event) => {
      mapState.labels = event.target.checked;
      renderMapScreen();
    });

    filters.querySelectorAll("input[data-book]").forEach((box) => {
      box.addEventListener("change", () => {
        if (box.checked) mapState.bookIds.add(box.dataset.book);
        else mapState.bookIds.delete(box.dataset.book);
        mapStopEditing();
        renderMapScreen();
      });
    });
    filters.querySelectorAll("input[data-type]").forEach((box) => {
      box.addEventListener("change", () => {
        if (box.checked) mapState.types.add(box.dataset.type);
        else mapState.types.delete(box.dataset.type);
        mapStopEditing();
        renderMapScreen();
      });
    });
    document.getElementById("strongOnly").addEventListener("change", (event) => {
      mapState.strongOnly = event.target.checked;
      mapStopEditing();
      renderMapScreen();
    });
    document.getElementById("allIdeas").addEventListener("change", (event) => {
      loadMapData(event.target.checked);
    });

    svg.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      mapDrag = { x: event.clientX, y: event.clientY, target: event.target };
      mapMoved = 0;
      svg.setPointerCapture(event.pointerId);
      svg.classList.add("panning");
    });
    svg.addEventListener("pointermove", (event) => {
      if (!mapDrag) return;
      const dx = event.clientX - mapDrag.x;
      const dy = event.clientY - mapDrag.y;
      mapMoved += Math.abs(dx) + Math.abs(dy);
      mapDrag.x = event.clientX;
      mapDrag.y = event.clientY;
      // viewBox равен размеру svg в пикселях, значит 1 единица = 1 px.
      mapView.x += dx;
      mapView.y += dy;
      applyView();
    });
    const stop = (event) => {
      if (!mapDrag) return;
      const target = mapDrag.target;
      const wasClick = mapMoved <= 6;
      mapDrag = null;
      svg.classList.remove("panning");
      if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
      if (wasClick) {
        const node = target && target.closest ? target.closest(".map-node") : null;
        const edge = target && target.closest ? target.closest(".map-edge") : null;
        if (node) {
          selectIdea(Number(node.dataset.id));
        } else if (edge) {
          const [from, to] = edge.dataset.edge.split("-").map(Number);
          selectLink(from, to);
        } else {
          selectIdea(null);
        }
      }
    };
    svg.addEventListener("pointerup", stop);
    svg.addEventListener("pointercancel", () => {
      mapDrag = null;
      svg.classList.remove("panning");
    });
    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, { passive: false });
  }

  function selectIdea(id) {
    mapStopEditing();
    mapState.selected = id;
    mapState.selectedLink = null;
    const svg = document.getElementById("mapSvg");
    if (svg) {
      const neighbors = new Set();
      if (id) neighbors.add(id);
      svg.querySelectorAll(".map-edge").forEach((line) => {
        const [from, to] = line.dataset.edge.split("-").map(Number);
        const on = !id || from === id || to === id;
        line.classList.toggle("dim", !on);
        line.classList.remove("sel");
        if (on && id) {
          neighbors.add(from);
          neighbors.add(to);
        }
      });
      svg.querySelectorAll(".map-node").forEach((group) => {
        const nodeId = Number(group.dataset.id);
        group.classList.toggle("sel", nodeId === id);
        group.classList.toggle("dim", Boolean(id) && !neighbors.has(nodeId));
      });
    }
    renderPanel();
  }

  function selectLink(from, to) {
    mapStopEditing();
    mapState.selected = null;
    mapState.selectedLink = { from, to };
    const svg = document.getElementById("mapSvg");
    if (svg) {
      svg.querySelectorAll(".map-edge").forEach((line) => {
        const [a, b] = line.dataset.edge.split("-").map(Number);
        const on = (a === from && b === to) || (a === to && b === from);
        line.classList.toggle("sel", on);
        line.classList.toggle("dim", !on);
      });
      svg.querySelectorAll(".map-node").forEach((group) => {
        const nodeId = Number(group.dataset.id);
        const on = nodeId === from || nodeId === to;
        group.classList.toggle("sel", on);
        group.classList.toggle("dim", !on);
      });
    }
    renderPanel();
  }

  function mapStopEditing() {
    mapEditing = false;
  }

  function renderPanel() {
    const panel = document.getElementById("mapPanel");
    if (!panel) return;
    const state = mapState;
    if (state.selectedLink) {
      renderLinkPanel(panel);
      return;
    }
    const idea = state.selected
      ? state.graph.ideas.find((item) => Number(item.id) === state.selected)
      : null;
    if (!idea) {
      panel.hidden = true;
      panel.innerHTML = "";
      return;
    }
    const related = state.links
      .filter((link) => Number(link.from_id) === Number(idea.id) || Number(link.to_id) === Number(idea.id))
      .sort((a, b) => Number(b.confidence) - Number(a.confidence));
    const byId = new Map(state.graph.ideas.map((item) => [Number(item.id), item]));
    const linksMarkup = related.map((link) => {
      const outgoing = Number(link.from_id) === Number(idea.id);
      const otherId = Number(outgoing ? link.to_id : link.from_id);
      const other = byId.get(otherId);
      if (!other) return "";
      const style = LINK_STYLES[link.type] || LINK_STYLES.same;
      return '<div class="p-link">'
        + '<div class="p-link-type" style="color:' + style.color + '">'
        + (outgoing ? "эта идея " : "") + esc(LINK_TYPES[link.type] || link.type)
        + (outgoing ? "" : " эту идею") + '</div>'
        + '<button type="button" class="p-link-idea" data-id="' + otherId + '">'
        + esc(shortText(other.idea, 90)) + '</button>'
        + '<div class="p-link-book">' + esc(shortText(other.book_title, 34))
        + ' · глава ' + esc(other.chapter) + ' · <span class="p-link-conf">уверенность '
        + Math.round(Number(link.confidence) * 100) + '%</span></div>'
        + (link.explanation ? '<p class="p-link-why">' + esc(link.explanation) + '</p>' : "")
        + '</div>';
    }).join("");
    const verdict = idea.verdict === "right" || idea.verdict === "wrong" ? idea.verdict : "";
    const badge = verdict
      ? '<div class="p-badge ' + verdict + '">' + (verdict === "right" ? "✓ верно" : "✕ неверно") + '</div>'
      : "";
    const color = state.colorOf.get(idea.book_id) || "var(--book-a)";
    panel.innerHTML = ''
      + '<button type="button" class="p-close" title="Закрыть">✕</button>'
      + '<p class="p-kicker"><span class="fdot" style="background:' + color
      + ';display:inline-block;vertical-align:middle;margin-right:6px"></span>'
      + esc(shortText(idea.book_title, 30)) + '</p>'
      + (mapEditing
        ? '<div class="p-edit"><textarea id="pEditText" rows="4">' + esc(idea.idea) + '</textarea>'
          + '<div class="p-edit-actions"><button type="button" class="vbtn" id="pEditSave">Сохранить</button>'
          + '<button type="button" class="vbtn" id="pEditCancel">Отмена</button></div></div>'
        : '<h3 class="p-idea">' + esc(idea.idea) + '</h3>')
      + badge
      + '<p class="p-meta">Глава ' + esc(idea.chapter) + ' · связей: ' + related.length + '</p>'
      + (idea.quote ? '<blockquote class="p-quote"><i>«' + esc(idea.quote) + '»</i></blockquote>' : "")
      + (idea.why ? '<p class="p-why"><b>Почему это важно:</b> ' + esc(idea.why) + '</p>' : "")
      + '<p class="p-links-title">Связи с другими книгами</p>'
      + (linksMarkup || '<p class="p-why">Пока нет связей с другими книгами.</p>')
      + '<div class="p-actions">'
      + '<button type="button" class="vbtn right' + (verdict === "right" ? " on" : "")
      + '" data-verdict="right">✓ Верно</button>'
      + '<button type="button" class="vbtn wrong' + (verdict === "wrong" ? " on" : "")
      + '" data-verdict="wrong">✕ Неверно</button>'
      + '<button type="button" class="vbtn" id="pEditBtn">✎ Изменить</button>'
      + '</div>';
    panel.hidden = false;
    panel.querySelector(".p-close").addEventListener("click", () => selectIdea(null));
    panel.querySelectorAll("[data-verdict]").forEach((button) => {
      button.addEventListener("click", () => saveVerdict(Number(idea.id), button.dataset.verdict));
    });
    panel.querySelector("#pEditBtn").addEventListener("click", () => {
      mapEditing = true;
      renderPanel();
      const textarea = document.getElementById("pEditText");
      if (textarea) {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }
    });
    panel.querySelectorAll(".p-link-idea").forEach((button) => {
      button.addEventListener("click", () => selectIdea(Number(button.dataset.id)));
    });
    const saveButton = panel.querySelector("#pEditSave");
    if (saveButton) {
      saveButton.addEventListener("click", () => {
        const textarea = document.getElementById("pEditText");
        saveIdeaText(Number(idea.id), textarea.value, saveButton);
      });
      panel.querySelector("#pEditCancel").addEventListener("click", () => {
        mapEditing = false;
        renderPanel();
      });
    }
  }

  function renderLinkPanel(panel) {
    const state = mapState;
    const pair = state.selectedLink;
    const link = visibleMap().links.find((item) => {
      const from = Number(item.from_id);
      const to = Number(item.to_id);
      return (from === pair.from && to === pair.to) || (from === pair.to && to === pair.from);
    });
    const byId = new Map(state.graph.ideas.map((item) => [Number(item.id), item]));
    const first = link ? byId.get(Number(link.from_id)) : null;
    const second = link ? byId.get(Number(link.to_id)) : null;
    if (!link || !first || !second) {
      panel.hidden = true;
      panel.innerHTML = "";
      return;
    }
    const style = LINK_STYLES[link.type] || LINK_STYLES.same;
    const side = (idea) => '<div class="p-pair">'
      + '<p class="p-pair-book"><span class="fdot" style="background:'
      + (state.colorOf.get(idea.book_id) || "var(--book-a)")
      + ';display:inline-block;vertical-align:middle;margin-right:6px"></span>'
      + esc(shortText(idea.book_title, 30)) + ' · глава ' + esc(idea.chapter) + '</p>'
      + '<h3 class="p-pair-idea">' + esc(idea.idea) + '</h3>'
      + (idea.quote ? '<blockquote class="p-quote"><i>«' + esc(idea.quote) + '»</i></blockquote>' : "")
      + '</div>';
    const verdict = link.verdict === "right" || link.verdict === "wrong" ? link.verdict : "";
    panel.innerHTML = ''
      + '<button type="button" class="p-close" title="Закрыть">✕</button>'
      + '<p class="p-kicker" style="color:' + style.color + '">' + style.icon + ' '
      + esc(LINK_TYPES[link.type] || link.type) + '</p>'
      + '<p class="p-meta">Уверенность ' + Math.round(Number(link.confidence) * 100)
      + '% · связь между книгами</p>'
      + side(first)
      + '<div class="p-pair-mid" style="color:' + style.color + '">' + style.icon + '</div>'
      + side(second)
      + (link.explanation
        ? '<p class="p-why"><b>Почему связаны:</b> ' + esc(link.explanation) + '</p>'
        : "")
      + '<div class="p-actions">'
      + '<button type="button" class="vbtn right' + (verdict === "right" ? " on" : "")
      + '" data-link-verdict="right">✓ Верно</button>'
      + '<button type="button" class="vbtn wrong' + (verdict === "wrong" ? " on" : "")
      + '" data-link-verdict="wrong">✕ Неверно</button>'
      + '</div>';
    panel.hidden = false;
    panel.querySelector(".p-close").addEventListener("click", () => selectIdea(null));
    panel.querySelectorAll("[data-link-verdict]").forEach((button) => {
      button.addEventListener("click", () => saveLinkVerdict(link, button.dataset.linkVerdict));
    });
  }

  async function saveLinkVerdict(link, verdict) {
    const next = link.verdict === verdict ? "" : verdict;
    try {
      const data = await api(
        "api/links/" + Number(link.from_id) + "-" + Number(link.to_id) + "/mark",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ verdict: next }),
        }
      );
      link.verdict = data.verdict;
      renderPanel();
    } catch (error) {
      alert(error.message);
    }
  }

  async function saveVerdict(ideaId, verdict) {
    const idea = mapState.graph.ideas.find((item) => Number(item.id) === ideaId);
    const next = idea && idea.verdict === verdict ? "" : verdict;
    try {
      const data = await api("api/ideas/" + ideaId + "/mark", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ verdict: next }),
      });
      if (idea) idea.verdict = data.verdict;
      mapState.selected = ideaId;
      renderMapScreen();
    } catch (error) {
      alert(error.message);
    }
  }

  async function saveIdeaText(ideaId, text, button) {
    const clean = text.trim();
    if (!clean) {
      alert("Идея не может быть пустой.");
      return;
    }
    button.disabled = true;
    try {
      const data = await api("api/ideas/" + ideaId + "/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idea: clean }),
      });
      const idea = mapState.graph.ideas.find((item) => Number(item.id) === ideaId);
      if (idea) idea.idea = data.idea;
      mapEditing = false;
      renderMapScreen();
    } catch (error) {
      alert(error.message);
      button.disabled = false;
    }
  }

  async function loadMapData(allIdeas) {
    const previous = mapState;
    previous.loading = true;
    renderMapScreen();
    try {
      const graph = await api(allIdeas ? "api/graph?all=1" : "api/graph");
      const selected = previous.selected;
      const selectedLink = previous.selectedLink;
      const fresh = makeMapState(graph, allIdeas);
      fresh.bookIds = previous.bookIds;
      fresh.types = previous.types;
      fresh.strongOnly = previous.strongOnly;
      fresh.labels = previous.labels;
      fresh.selected = fresh.graph.ideas.some((idea) => Number(idea.id) === selected)
        ? selected
        : null;
      fresh.selectedLink = fresh.selected ? null : selectedLink;
      mapState = fresh;
      mapView = { x: 0, y: 0, scale: 1 };
      mapStopEditing();
      renderMapScreen();
    } catch (error) {
      previous.loading = false;
      renderMapScreen();
      alert(error.message);
    }
  }

  const BRIDGE_GROUPS = [
    { key: "agree", title: "Согласны", icon: "✓", color: "var(--supports)", types: ["supports", "same"] },
    { key: "disagree", title: "Спорят", icon: "⚔", color: "var(--contradicts)", types: ["contradicts"] },
    { key: "develop", title: "Развивают", icon: "➕", color: "var(--extends)", types: ["extends"] },
    { key: "example", title: "Примеры", icon: "📌", color: "var(--example)", types: ["example"] },
  ];
  let bridgeSort = "desc";   // "desc" — сначала самые уверенные
  let bridgePairs = [];
  let pendingBridge = null;  // пара, которую надо открыть на карте

  function bridgeCard(link, first, second, colorOf) {
    const style = LINK_STYLES[link.type] || LINK_STYLES.same;
    const side = (idea) => '<div class="bridge-side">'
      + '<p class="bridge-book"><span class="fdot" style="background:'
      + (colorOf.get(idea.book_id) || "var(--book-a)") + '"></span>'
      + esc(shortText(idea.book_title, 34)) + ' · глава ' + esc(idea.chapter) + '</p>'
      + '<h3 class="bridge-title">' + esc(idea.title || shortText(idea.idea, 60)) + '</h3>'
      + (idea.quote ? '<blockquote class="bridge-quote">«' + esc(idea.quote) + '»</blockquote>' : "")
      + '</div>';
    return ''
      + '<article class="bridge" data-link="' + link.from_id + '-' + link.to_id + '">'
      + '<div class="bridge-pair">'
      + side(first)
      + '<div class="bridge-mid" style="color:' + style.color + '">'
      + '<span class="bridge-icon">' + style.icon + '</span>'
      + '<span class="bridge-type">' + esc(LINK_TYPES[link.type] || link.type) + '</span>'
      + '<span class="bridge-conf" title="уверенность связи">'
      + Math.round(Number(link.confidence) * 100) + '%</span>'
      + '</div>'
      + side(second)
      + '</div>'
      + '<footer class="bridge-foot">'
      + (link.explanation
        ? '<p class="bridge-why"><b>Почему связаны:</b> ' + esc(link.explanation) + '</p>'
        : "")
      + '<button type="button" class="bridge-open" data-open-pair="'
      + link.from_id + '-' + link.to_id + '">На карте →</button>'
      + '</footer>'
      + '</article>';
  }

  function renderBridgeList() {
    const list = document.getElementById("bridgeList");
    if (!list) return;
    const colorOf = new Map();
    const booksOrder = [...new Set(bridgePairs.map((pair) => pair.first.book_id))];
    bridgePairs.forEach((pair) => {
      [pair.first, pair.second].forEach((idea) => {
        if (!booksOrder.includes(idea.book_id)) booksOrder.push(idea.book_id);
      });
    });
    booksOrder.forEach((id, index) => colorOf.set(id, "var(" + BOOK_VARS[index % BOOK_VARS.length] + ")"));

    list.innerHTML = BRIDGE_GROUPS.map((group) => {
      const items = bridgePairs
        .filter((pair) => group.types.includes(pair.link.type))
        .sort((a, b) => {
          const left = Number(a.link.confidence);
          const right = Number(b.link.confidence);
          return bridgeSort === "asc" ? left - right : right - left;
        });
      return '<section class="bgroup">'
        + '<h2 class="bgroup-head" style="color:' + group.color + '">'
        + '<span class="bgroup-icon">' + group.icon + '</span>' + group.title
        + '<span class="bgroup-count">' + items.length + '</span></h2>'
        + (items.length
          ? items.map((pair) => bridgeCard(pair.link, pair.first, pair.second, colorOf)).join("")
          : '<p class="bridge-empty">Связей этого вида нет.</p>')
        + '</section>';
    }).join("");

    list.querySelectorAll("[data-open-pair]").forEach((button) => {
      button.addEventListener("click", () => {
        const [from, to] = button.dataset.openPair.split("-").map(Number);
        pendingBridge = { from, to };
        if (location.hash === "#/map") showMap();
        else location.hash = "#/map";
      });
    });

    const hint = document.getElementById("bridgesCount");
    if (hint) hint.textContent = "Связей между книгами: " + bridgePairs.length;
  }

  async function showBridges() {
    app.classList.remove("map-main");
    mapLink.classList.remove("active");
    libLink.classList.remove("active");
    bridgesLink.classList.add("active");
    app.innerHTML = ''
      + '<section class="bridges">'
      + '<div class="bridges-head">'
      + '<h1>Мосты</h1>'
      + '<a class="btn bridges-open-map" href="#/map">Карта</a>'
      + '</div>'
      + '<p class="lead">Связи между книгами: где авторы согласны, спорят, '
      + 'развивают мысль друг друга или приводят пример.</p>'
      + '<div class="bridges-controls">'
      + '<span class="bridges-label">Сортировка по уверенности</span>'
      + '<div class="seg" id="bridgeSort" role="group" aria-label="Сортировка по уверенности">'
      + '<button type="button" data-sort="desc"' + (bridgeSort === "desc" ? ' class="on"' : "")
      + '>Сначала уверенные</button>'
      + '<button type="button" data-sort="asc"' + (bridgeSort === "asc" ? ' class="on"' : "")
      + '>Сначала сомнительные</button>'
      + '</div>'
      + '<span class="hint" id="bridgesCount"></span>'
      + '</div>'
      + '<div id="bridgeList"><p class="empty">Собираю связи…</p></div>'
      + '</section>';

    const section = app.querySelector(".bridges");
    let graph = null;
    try {
      graph = await api("api/graph");
    } catch (error) {
      if (section.isConnected) {
        document.getElementById("bridgeList").innerHTML =
          '<p class="empty">' + esc(error.message) + '</p>';
      }
      return;
    }
    if (!section.isConnected) return;
    const byId = new Map(graph.ideas.map((idea) => [Number(idea.id), idea]));
    bridgePairs = graph.links
      .filter((link) => byId.has(Number(link.from_id)) && byId.has(Number(link.to_id)))
      .map((link) => ({
        link,
        first: byId.get(Number(link.from_id)),
        second: byId.get(Number(link.to_id)),
      }));
    renderBridgeList();

    document.querySelectorAll("#bridgeSort [data-sort]").forEach((button) => {
      button.addEventListener("click", () => {
        bridgeSort = button.dataset.sort;
        document.querySelectorAll("#bridgeSort [data-sort]").forEach((item) => {
          item.classList.toggle("on", item.dataset.sort === bridgeSort);
        });
        renderBridgeList();
      });
    });
  }

  function openPendingBridge() {
    if (!pendingBridge) return;
    const pair = pendingBridge;
    pendingBridge = null;
    if (!mapState) return;
    const link = mapState.links.find((item) => {
      const from = Number(item.from_id);
      const to = Number(item.to_id);
      return (from === pair.from && to === pair.to) || (from === pair.to && to === pair.from);
    });
    if (!link) return;
    // Фильтры могли спрятать эту связь — включаем её тип, книгу и уверенность.
    const byId = new Map(mapState.graph.ideas.map((idea) => [Number(idea.id), idea]));
    mapState.types.add(link.type);
    [link.from_id, link.to_id].forEach((id) => {
      const idea = byId.get(Number(id));
      if (idea) mapState.bookIds.add(idea.book_id);
    });
    if (Number(link.confidence) < STRONG_CONF) mapState.strongOnly = false;
    renderMapScreen();
    selectLink(pair.from, pair.to);
  }

  async function showMap() {
    app.classList.add("map-main");
    mapLink.classList.add("active");
    libLink.classList.remove("active");
    bridgesLink.classList.remove("active");
    if (mapState) {
      renderMapScreen();
      openPendingBridge();
      return;
    }
    app.innerHTML = '<div class="map-screen"><div class="map-canvas">'
      + '<div class="map-empty">Строю карту связей…</div></div></div>';
    try {
      const graph = await api("api/graph");
      mapState = makeMapState(graph, false);
    } catch (error) {
      app.innerHTML = '<div class="map-screen"><div class="map-canvas">'
        + '<div class="map-empty">' + esc(error.message) + '</div></div></div>';
      return;
    }
    renderMapScreen();
    openPendingBridge();
  }

  function route() {
    const onMap = location.hash === "#/map";
    const onBridges = location.hash === "#/bridges";
    app.classList.toggle("map-main", onMap);
    mapLink.classList.toggle("active", onMap);
    bridgesLink.classList.toggle("active", onBridges);
    libLink.classList.toggle("active", !onMap && !onBridges);
    if (onMap) {
      showMap();
      return;
    }
    if (onBridges) {
      showBridges();
      return;
    }
    const idea = location.hash.match(/^#\/idea\/(\d+)$/);
    if (idea) { showIdea(idea[1]); return; }
    const chapter = location.hash.match(/^#\/book\/([^/]+)\/chapter\/(\d+)$/);
    if (chapter) { showChapter(decodeURIComponent(chapter[1]), chapter[2]); return; }
    const match = location.hash.match(/^#\/book\/(.+)$/);
    if (match) showBook(decodeURIComponent(match[1]));
    else showLibrary();
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) uploadBook(fileInput.files[0]);
  });

  // Сохраняем выбор только по кнопке: пока её не нажали, тема следует системе.
  function applyTheme(theme, remember) {
    document.documentElement.dataset.theme = theme;
    if (remember) localStorage.setItem("theme", theme);
  }
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
  });
  const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(localStorage.getItem("theme") || systemTheme, false);

  // На телефоне карта не помещается, поэтому сразу открываем «Мосты».
  if (!location.hash && window.innerWidth < 700) location.hash = "#/bridges";

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
