  // Заголовок вкладки браузера — по экрану.
  function setPageTitle() {
    const hash = location.hash || "#/";
    let name = "";
    if (hash === "#/map") name = "Карта идей";
    else if (hash === "#/review") name = "Повторение";
    else if (hash.startsWith("#/debate")) name = "Спор авторов";
    else if (hash === "#/ask") name = "Спросить библиотеку";
    else if (hash === "#/bridges") name = "Мосты между книгами";
    else if (hash === "#/about") name = "О проекте";
    else if (hash.startsWith("#/idea/")) name = "Идея";
    else {
      const title = app.querySelector("h1");
      name = title ? title.textContent.trim() : "";
    }
    document.title = name && name !== "Библиотека"
      ? name + " — Marginalia"
      : "Marginalia — библиотека";
  }

  // Переворот страницы: снимок старого экрана улетает, новый проявляется.
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  function swapSheet() {
    if (reduceMotion.matches || !app.firstElementChild) return;
    const box = app.getBoundingClientRect();
    const padding = getComputedStyle(app).padding;
    const sheet = app.cloneNode(true);
    sheet.removeAttribute("id");
    sheet.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
    sheet.classList.remove("turn-in");
    sheet.classList.add("turn-sheet");
    sheet.style.top = box.top + "px";
    sheet.style.left = box.left + "px";
    sheet.style.width = box.width + "px";
    sheet.style.height = Math.min(box.height, window.innerHeight) + "px";
    sheet.style.padding = padding;
    document.body.appendChild(sheet);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => sheet.classList.add("turn-out"));
    });
    setTimeout(() => sheet.remove(), 700);
  }

  let lastHash = null;

  function route() {
    const hash = location.hash;
    const changed = lastHash !== null && hash !== lastHash;
    lastHash = hash;
    if (changed) swapSheet();
    renderRoute();
    setPageTitle();
    app.classList.remove("turn-in");
    if (changed && !reduceMotion.matches) {
      void app.offsetWidth;  // перезапустить анимацию появления
      app.classList.add("turn-in");
    }
  }

  function renderRoute() {
    const onMap = location.hash === "#/map";
    const onBridges = location.hash === "#/bridges";
    const onAsk = location.hash === "#/ask";
    const onDebate = location.hash === "#/debate"
      || location.hash.startsWith("#/debate/");
    const onReview = location.hash === "#/review";
    const onAbout = location.hash === "#/about";
    app.classList.toggle("map-main", onMap);
    document.getElementById("pageWm").classList.toggle("is-off", onMap);
    mapLink.classList.toggle("active", onMap);
    bridgesLink.classList.toggle("active", onBridges);
    askLink.classList.toggle("active", onAsk);
    debateLink.classList.toggle("active", onDebate);
    reviewLink.classList.toggle("active", onReview);
    aboutLink.classList.toggle("active", onAbout);
    libLink.classList.toggle("active",
      !onMap && !onBridges && !onAsk && !onDebate && !onReview && !onAbout);
    if (onAbout) {
      showAbout();
      return;
    }
    if (onMap) {
      showMap();
      return;
    }
    if (onBridges) {
      showBridges();
      return;
    }
    if (onAsk) {
      showAsk();
      return;
    }
    if (onReview) {
      showReview();
      return;
    }
    if (onDebate) {
      const pair = location.hash.match(/^#\/debate\/([^/]+)\/([^/]+)$/);
      if (pair) {
        showDebate(decodeURIComponent(pair[1]), decodeURIComponent(pair[2]));
        return;
      }
      // #/debate/<книга> — открываем выбор второй книги с уже выбранной первой.
      const one = location.hash.match(/^#\/debate\/([^/]+)$/);
      showDebate(one ? decodeURIComponent(one[1]) : "", "");
      return;
    }
    const idea = location.hash.match(/^#\/idea\/(\d+)$/);
    if (idea) { showIdea(idea[1]); return; }
    const chapter = location.hash.match(/^#\/book\/([^/]+)\/chapter\/(\d+)$/);
    if (chapter) { showChapter(decodeURIComponent(chapter[1]), chapter[2]); return; }
    const match = location.hash.match(/^#\/book\/(.+)$/);
    if (match) showBook(decodeURIComponent(match[1]));
    else showLibrary();
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) uploadBook(fileInput.files[0]);
  });

  // Поиск по библиотеке: окно поверх страницы, группы «идеи и цитаты»,
  // «книги», «заметки». Сервер сам разбирает регистр кириллицы.
  const SEARCH_HINT = "Начните вводить: ищем по идеям, цитатам, книгам и заметкам.";
  let searchTimer = null;
  let searchSeq = 0;

  /** Корень слова: «свободы», «свободе», «свободой» → «свобод». */
  const WORD_ENDINGS = [
    "иями", "ями", "ами", "ого", "его", "ому", "ему", "ыми", "ими", "иях",
    "ях", "ах", "ов", "ев", "ей", "ой", "ый", "ий", "ая", "яя", "ое", "ее",
    "ые", "ие", "ам", "ям", "ом", "ем", "ую", "юю", "ию", "ия", "ии", "ою",
    "ею", "а", "я", "о", "е", "ы", "и", "у", "ю",
  ];
  function wordStem(word) {
    const value = word.toLowerCase();
    for (const end of WORD_ENDINGS) {
      if (value.length - end.length >= 3 && value.endsWith(end)) {
        return value.slice(0, value.length - end.length);
      }
    }
    return value;
  }

  /** Подсвечиваем все формы слова запроса, остальное экранируем. */
  function markText(text, query) {
    const value = String(text ?? "");
    const stems = [];
    ((query || "").toLowerCase().match(/[\p{L}\p{N}]+/gu) || []).forEach((token) => {
      const stem = wordStem(token);
      if (stem.length >= 3 && !stems.includes(stem)) stems.push(stem);
    });
    if (!stems.length) return esc(value);
    const wordRe = /[\p{L}\p{N}]+/gu;
    let out = "", last = 0, match;
    while ((match = wordRe.exec(value))) {
      const lower = match[0].toLowerCase();
      out += esc(value.slice(last, match.index));
      out += stems.some((stem) => lower.startsWith(stem))
        ? "<mark>" + esc(match[0]) + "</mark>"
        : esc(match[0]);
      last = match.index + match[0].length;
    }
    return out + esc(value.slice(last));
  }

  function searchItem(target, title, meta, quote, query) {
    return '<button class="search-item" type="button" data-hash="' + esc(target) + '">'
      + '<span class="search-item-title">' + markText(title, query) + '</span>'
      + (quote ? '<span class="search-item-meta">«' + markText(quote, query) + '»</span>' : "")
      + (meta ? '<span class="search-item-meta">' + markText(meta, query) + '</span>' : "")
      + '</button>';
  }

  function renderSearchHint() {
    searchResults.innerHTML = '<p class="search-empty">' + esc(SEARCH_HINT) + '</p>';
  }

  function renderSearch(data, query) {
    if (!data.total) {
      searchResults.innerHTML = '<p class="search-empty">Ничего не найдено по запросу «'
        + esc(query) + '». Попробуйте другое слово или часть цитаты.</p>';
      return;
    }
    const parts = [];
    const groupCount = (shown, found) => "· " + (shown < found ? shown + " из " + found : found);
    if (data.ideas.length) {
      parts.push('<p class="search-group-title">Идеи и цитаты <span>'
        + groupCount(data.ideas.length, data.counts.ideas) + '</span></p>');
      data.ideas.forEach((idea) => {
        const meta = idea.book_title + ' · глава ' + idea.chapter
          + (idea.chapter_title ? ' · ' + idea.chapter_title : "");
        parts.push(searchItem("#/idea/" + idea.id, idea.idea, meta, idea.quote, query));
      });
    }
    if (data.books.length) {
      parts.push('<p class="search-group-title">Книги <span>'
        + groupCount(data.books.length, data.counts.books) + '</span></p>');
      data.books.forEach((book) => {
        parts.push(searchItem("#/book/" + encodeURIComponent(book.id), book.title,
          book.author, "", query));
      });
    }
    if (data.notes.length) {
      parts.push('<p class="search-group-title">Заметки <span>'
        + groupCount(data.notes.length, data.counts.notes) + '</span></p>');
      data.notes.forEach((note) => {
        parts.push(searchItem("#/idea/" + note.idea_id, note.text,
          note.book_title + ' · к идее «' + shortText(note.idea, 48) + '»', "", query));
      });
    }
    searchResults.innerHTML = parts.join("");
  }

  async function runSearch(query, seq) {
    if (seq !== searchSeq) return;
    searchResults.innerHTML = '<p class="search-empty">Ищем…</p>';
    try {
      const data = await api("api/search?q=" + encodeURIComponent(query));
      if (seq !== searchSeq) return;
      renderSearch(data, query);
    } catch (error) {
      if (seq !== searchSeq) return;
      searchResults.innerHTML = '<p class="search-empty">Не получилось найти: '
        + esc(error.message) + '</p>';
    }
  }

  function openSearch() {
    searchOverlay.hidden = false;
    searchInput.value = "";
    renderSearchHint();
    searchInput.focus();
  }

  function closeSearch() {
    if (searchOverlay.hidden) return;
    searchOverlay.hidden = true;
    searchSeq += 1;            // ответ, который ещё летит, уже не нужен
    clearTimeout(searchTimer);
  }

  searchBtn.addEventListener("click", openSearch);
  searchClose.addEventListener("click", closeSearch);
  searchOverlay.addEventListener("mousedown", (event) => {
    if (event.target === searchOverlay) closeSearch();
  });
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchSeq += 1;
    const query = searchInput.value.trim();
    if (query.length < 2) {
      renderSearchHint();
      return;
    }
    const seq = searchSeq;
    searchTimer = setTimeout(() => runSearch(query, seq), 200);
  });
  searchInput.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const first = searchResults.querySelector(".search-item");
    if (first) first.click();
  });
  searchResults.addEventListener("click", (event) => {
    const item = event.target.closest(".search-item");
    if (!item) return;
    const target = item.dataset.hash;
    closeSearch();
    if (location.hash === target) route();
    else location.hash = target;
  });
  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      if (searchOverlay.hidden) openSearch();
      else closeSearch();
      return;
    }
    if (event.key === "Escape" && !searchOverlay.hidden) closeSearch();
  });

  // Сохраняем выбор только по кнопке: пока её не нажали, тема следует системе.
  function applyTheme(theme, remember) {
    document.documentElement.dataset.theme = theme;
    if (remember) localStorage.setItem("theme", theme);
  }
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
  });
  const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(localStorage.getItem("theme") || systemTheme, false);

  // На телефоне карта не помещается, поэтому сразу открываем «Мосты».
  if (!location.hash && window.innerWidth < 700) location.hash = "#/bridges";

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
