<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia — библиотека</title>
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #FFFDF9;
    --ink: #1F1B16;
    --ink-muted: #6B6358;
    --line: #E4DCCC;
    --accent: #B4532A;
    --book-a: #8C6239;
    --book-b: #4F6B72;
    --book-c: #7A5C99;
    --book-d: #A0782E;
    --book-e: #5F7D3E;
    --book-f: #9A5B4F;
    --supports: #4F7A5A;
    --contradicts: #B23A48;
    --extends: #3D5A98;
    --example: #C08A2E;
    --same: #8A8278;
    --shadow: 0 18px 40px -24px rgba(60, 45, 25, .45);
    --serif: "Times New Roman", Times, "Tinos", "Liberation Serif", serif;
    --sans: "Manrope", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #13110E;
    --surface: #1C1915;
    --ink: #EFE7DA;
    --ink-muted: #A79C8B;
    --line: #322C24;
    --accent: #D07A4E;
    --book-a: #B08155;
    --book-b: #6E8F97;
    --book-c: #9C82B8;
    --book-d: #C49A4A;
    --book-e: #7F9E5C;
    --book-f: #B47A6C;
    --supports: #6C9B78;
    --contradicts: #D15E6B;
    --extends: #6C86C4;
    --example: #D9A646;
    --same: #A39A8E;
    --shadow: 0 18px 40px -24px rgba(0, 0, 0, .7);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    transition: background .25s, color .25s;
  }
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 24px;
    padding: 14px 32px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: .02em;
  }
  .brand span { color: var(--accent); }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-link {
    padding: 7px 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--ink-muted);
    font-size: 14px;
    text-decoration: none;
  }
  .nav-link:hover { color: var(--ink); border-color: var(--line); }
  .nav-link.active { color: var(--ink); border-color: var(--line); background: var(--surface); }
  .icon-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-muted);
    font-size: 15px;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-muted); }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 32px 80px; }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 42px;
    line-height: 1.15;
    margin: 0 0 8px;
  }
  .lead { color: var(--ink-muted); margin: 0 0 32px; max-width: 560px; }
  .upload {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 20px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    background: var(--surface);
    margin-bottom: 40px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #FFF8F2;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .55; cursor: default; filter: none; }
  .hint { color: var(--ink-muted); font-size: 13px; }
  .note { font-size: 14px; }
  .note.error { color: #B3261E; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 30px 24px;
  }
  .card { text-align: left; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font: inherit; }
  .cover {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 6px 12px 12px 6px;
    background: linear-gradient(150deg, var(--book-a), var(--book-b));
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px 18px;
    color: #FBF6EC;
    transition: transform .2s;
  }
  .card:hover .cover { transform: translateY(-4px); }
  .cover::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 9px;
    background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.06) 60%, rgba(0,0,0,.12));
  }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover-title { position: relative; z-index: 1; font-family: var(--serif); font-size: 20px; line-height: 1.2; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .cover-author { position: relative; z-index: 1; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .9; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .card-title { margin: 14px 0 2px; font-family: var(--serif); font-size: 18px; }
  .card-meta { color: var(--ink-muted); font-size: 13px; }
  .empty {
    padding: 48px 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    text-align: center;
    color: var(--ink-muted);
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 26px;
    border: 0; background: none; padding: 0;
    color: var(--ink-muted); font: inherit; font-size: 14px; cursor: pointer;
  }
  .back:hover { color: var(--ink); }
  .book-head { display: flex; gap: 36px; align-items: flex-start; margin-bottom: 44px; }
  .book-head .cover { width: 230px; flex: 0 0 230px; }
  .book-info h1 { font-size: 40px; }
  .book-author { margin: 0 0 18px; color: var(--ink-muted); font-size: 16px; }
  .facts { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .fact b { display: block; font-family: var(--serif); font-size: 22px; font-weight: 400; }
  .fact span { color: var(--ink-muted); font-size: 13px; }
  .chapters { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .chapter-row {
    display: flex; align-items: baseline; gap: 16px;
    width: 100%; padding: 14px 4px;
    border: 0; border-bottom: 1px solid var(--line);
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .chapter-row:hover .name { color: var(--accent); }
  .chapters .num { flex: 0 0 34px; color: var(--ink-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .chapters .name { flex: 1; font-family: var(--serif); font-size: 19px; }
  .chapters .size { color: var(--ink-muted); font-size: 12px; white-space: nowrap; }
  .reader { max-width: 660px; }
  .reader h1 { font-size: 34px; margin: 0 0 6px; }
  .reader-meta { color: var(--ink-muted); font-size: 13px; margin-bottom: 30px; }
  .reader-text { font-family: var(--serif); font-size: 19px; line-height: 1.7; }
  .reader-text p { margin: 0 0 1.1em; }
  .tabs {
    display: inline-flex; gap: 4px; padding: 4px; margin: 0 0 26px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  .tab {
    border: 0; border-radius: 999px; background: none;
    color: var(--ink-muted); font: inherit; font-size: 13px;
    padding: 7px 16px; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--accent); color: #FFF8F2; }
  html[data-theme="dark"] .tab[aria-selected="true"] { color: #1C1915; }
  .ideas { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .idea {
    padding: 20px 22px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
  }
  .idea-text { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; line-height: 1.35; }
  .idea blockquote {
    margin: 0 0 12px; padding-left: 14px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 16px; line-height: 1.6;
    color: var(--ink-muted);
  }
  .idea-why { margin: 0; font-size: 13px; color: var(--ink-muted); }
  .idea-rank {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 10px; font-size: 12px; color: var(--ink-muted);
  }
  .rank-num { letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .idea-chapter {
    border: 0; background: none; padding: 0;
    font: inherit; color: var(--accent); cursor: pointer; text-align: left;
  }
  .idea-chapter:hover { text-decoration: underline; }
  .summary-about {
    margin: 0 0 26px; font-family: var(--serif); font-size: 20px; line-height: 1.5;
  }
  .summary-points {
    margin: 0; padding: 0 0 0 26px;
    font-size: 16px; line-height: 1.55;
  }
  .summary-points li { margin: 0 0 14px; padding-left: 4px; }
  .summary-points li::marker { color: var(--accent); font-variant-numeric: tabular-nums; }
  .section-title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px; }
  .idea-link { color: inherit; text-decoration: none; }
  .idea-link:hover { color: var(--accent); }
  .idea-link::after { content: " →"; color: var(--ink-muted); }
  .idea-page .idea-text { margin: 0 0 16px; }
  .idea-page blockquote,
  .link-card blockquote {
    margin: 0 0 12px; padding-left: 14px;
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 16px; line-height: 1.6;
    color: var(--ink-muted);
  }
  .idea-page .idea-why { margin-bottom: 30px; }
  .note-form { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: 0 0 18px; }
  .note-form textarea {
    width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface, transparent); color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1.5;
  }
  .note-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .notes { list-style: none; margin: 0 0 30px; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .note-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .note-text { margin: 0 0 8px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-meta { margin: 0; display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-muted); }
  .note-del {
    border: 0; padding: 0; background: none; color: var(--ink-muted);
    font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline;
  }
  .note-del:hover { color: var(--accent); }
  #noteList .hint { margin: 0 0 30px; }
  .link-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    margin: 0 0 8px; font-size: 12px; color: var(--ink-muted);
  }
  .link-type { color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
  .link-idea { margin: 0 0 10px; font-family: var(--serif); font-size: 18px; line-height: 1.35; }
  .link-why { margin: 10px 0 0; font-size: 13px; color: var(--ink-muted); }
  /* --- карта идей --- */
  main.map-main {
    max-width: none;
    padding: 0;
    height: calc(100vh - 65px);
    height: calc(100dvh - 65px);
    overflow: hidden;
  }
  .map-screen { display: grid; grid-template-columns: 224px 1fr; height: 100%; position: relative; }
  .map-filters {
    border-right: 1px solid var(--line);
    background: var(--surface);
    padding: 22px 18px 32px;
    overflow-y: auto;
    min-width: 0;
  }
  .map-filters h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0 0 2px; }
  .map-filters .count { color: var(--ink-muted); font-size: 12px; margin: 0 0 22px; }
  .fgroup { margin-bottom: 22px; }
  .fgroup-title {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-muted); margin: 0 0 6px;
  }
  .frow {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-size: 13px; cursor: pointer; user-select: none;
  }
  .frow input { accent-color: var(--accent); margin: 0; }
  .fdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .fline { width: 22px; height: 0; border-top-width: 2px; border-top-style: solid; flex: none; }
  .fcount { margin-left: auto; color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .frange { width: 100%; accent-color: var(--accent); margin: 4px 0 2px; }
  .fvalue { color: var(--ink-muted); font-size: 12px; display: flex; justify-content: space-between; }
  .fnote { color: var(--ink-muted); font-size: 12px; line-height: 1.4; }
  .map-canvas { position: relative; overflow: hidden; background: var(--bg); min-width: 0; }
  #mapSvg { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
  #mapSvg.panning { cursor: grabbing; }
  .map-tools {
    position: absolute; left: 14px; bottom: 14px; z-index: 3;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px; border-radius: 12px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .map-tools button {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  .map-tools button:hover { border-color: var(--ink-muted); }
  .map-tools .wide { width: auto; padding: 0 10px; font-size: 12px; }
  .map-tools label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); padding: 0 6px; cursor: pointer; }
  #filtersBtn { display: none; }
  .map-edge { fill: none; }
  .map-node { cursor: pointer; }
  .map-node circle { stroke: var(--surface); stroke-width: 1.5; transition: opacity .15s; }
  .map-node.sel circle { stroke: var(--ink); stroke-width: 2.5; }
  .map-node text {
    font-family: var(--sans); font-size: 14px; fill: var(--ink);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  .map-node.sel text { font-weight: 600; }
  .map-edge.dim, .map-node.dim { opacity: .12; }
  .map-head-title {
    font-family: var(--serif); font-size: 16px; fill: var(--ink);
  }
  .map-head-count { font-size: 11px; fill: var(--ink-muted); }
  .map-head-initial { font-family: var(--serif); font-size: 24px; fill: var(--ink); }
  .map-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 32px; color: var(--ink-muted); font-size: 14px;
    pointer-events: none;
  }
  .map-panel {
    position: absolute; top: 14px; right: 14px; bottom: 14px; z-index: 4;
    width: min(360px, calc(100% - 28px));
    padding: 22px 22px 26px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow-y: auto;
  }
  .map-panel[hidden] { display: none; }
  .p-close {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border: 0; border-radius: 50%;
    background: none; color: var(--ink-muted); font: inherit; font-size: 17px; cursor: pointer;
  }
  .p-close:hover { color: var(--ink); background: var(--bg); }
  .p-kicker { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; padding-right: 30px; }
  .p-idea { font-family: var(--serif); font-size: 21px; line-height: 1.3; margin: 0 0 10px; }
  .p-badge {
    display: inline-block; margin: 0 0 12px; padding: 3px 10px;
    border-radius: 999px; font-size: 11px; letter-spacing: .05em;
    border: 1px solid currentColor;
  }
  .p-badge.right { color: var(--supports); }
  .p-badge.wrong { color: var(--contradicts); }
  .p-meta { color: var(--ink-muted); font-size: 12px; margin: 0 0 16px; }
  .p-quote {
    margin: 0 0 14px; padding: 12px 14px;
    border-left: 3px solid var(--accent);
    background: var(--bg); border-radius: 0 8px 8px 0;
    font-family: var(--serif); font-size: 15px; line-height: 1.45;
  }
  .p-quote i { font-style: italic; }
  .p-why { font-size: 13px; color: var(--ink-muted); margin: 0 0 18px; }
  .p-why b { color: var(--ink); font-weight: 600; }
  .p-links-title {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-muted); margin: 0 0 8px;
    padding-top: 14px; border-top: 1px solid var(--line);
  }
  .p-link { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .p-link:last-child { border-bottom: 0; }
  .p-link-type { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .p-link-idea {
    display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0;
    margin: 4px 0 0; font: inherit; font-size: 13px; line-height: 1.4; color: var(--ink);
    cursor: pointer;
  }
  .p-link-idea:hover { color: var(--accent); }
  .p-link-book { color: var(--ink-muted); font-size: 11px; }
  .p-link-why { margin: 5px 0 0; font-size: 12px; color: var(--ink-muted); line-height: 1.4; }
  .p-link-conf { color: var(--ink-muted); font-size: 11px; }
  .p-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .vbtn {
    padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
  }
  .vbtn:hover { border-color: var(--ink-muted); }
  .vbtn.right.on { color: var(--supports); border-color: var(--supports); background: color-mix(in srgb, var(--supports) 12%, var(--surface)); }
  .vbtn.wrong.on { color: var(--contradicts); border-color: var(--contradicts); background: color-mix(in srgb, var(--contradicts) 12%, var(--surface)); }
  .p-edit { width: 100%; }
  .p-edit textarea {
    width: 100%; margin: 8px 0; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink);
    font: inherit; font-size: 14px; line-height: 1.45; resize: vertical;
  }
  .p-edit textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .p-edit-actions { display: flex; gap: 6px; }
  @media (max-width: 860px) {
    .map-screen { grid-template-columns: 1fr; }
    .map-filters {
      position: absolute; top: 58px; bottom: 0; left: 0; z-index: 6; width: 268px;
      transform: translateX(-100%); transition: transform .2s;
      box-shadow: var(--shadow);
    }
    .map-screen.filters-open .map-filters { transform: none; }
    .map-tools { z-index: 7; }
    #filtersBtn { display: inline-flex; width: auto; padding: 0 10px; font-size: 12px; }
    .map-panel { z-index: 8; width: min(340px, calc(100% - 28px)); }
  }
  @media (max-width: 720px) {
    .top { padding: 12px 18px; }
    main { padding: 28px 18px 60px; }
    h1 { font-size: 32px; }
    .book-head { flex-direction: column; gap: 22px; }
    .book-head .cover { width: 170px; flex: none; }
    .book-info h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">MARGIN<span>·</span>ALIA</div>
  <div class="top-actions">
    <a class="nav-link" id="libLink" href="#/">Библиотека</a>
    <a class="nav-link" id="mapLink" href="#/map">Карта</a>
    <button class="icon-btn" id="themeBtn" type="button" title="Светлая или тёмная тема">◐</button>
  </div>
</header>

<main id="app"></main>

<input type="file" id="file" accept=".epub,.txt" hidden>
<script>
  const app = document.getElementById("app");
  const themeBtn = document.getElementById("themeBtn");
  const libLink = document.getElementById("libLink");
  const mapLink = document.getElementById("mapLink");
  const fileInput = document.getElementById("file");

  const pageBase = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
  let chapterView = "text";  // какая вкладка открыта в читалке: текст или идеи
  let bookView = "chapters"; // какая вкладка открыта на странице книги: главы или ключевые идеи

  async function api(path, options) {
    const response = await fetch(pageBase + path, options);
    if (!response.ok) throw new Error((await response.text()) || ("Ошибка " + response.status));
    return response.json();
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({

  function chaptersWord(n) {
    const ten = n % 10, hundred = n % 100;
    if (ten === 1 && hundred !== 11) return "глава";
    if (ten >= 2 && ten <= 4 && (hundred < 12 || hundred > 14)) return "главы";
    return "глав";
  }

  // --- карта идей ---
  const LINK_STYLES = {
    supports: { color: "var(--supports)", dash: "", width: 2 },
    contradicts: { color: "var(--contradicts)", dash: "7 5", width: 2 },
    extends: { color: "var(--extends)", dash: "", width: 1.6 },
    example: { color: "var(--example)", dash: "1 4", width: 2.2 },
    same: { color: "var(--same)", dash: "2 5", width: 1.6 },
  };
  const BOOK_VARS = ["--book-a", "--book-b", "--book-c", "--book-d", "--book-e", "--book-f"];
  // Карта рисуется в пикселях холста: так подписи остаются настоящего
  // размера (14px) при любом экране, а не уменьшаются вместе с картинкой.
  let mapSize = { w: 1000, h: 720 };

  const MAP_MARGIN = 18;  // поля по краям карты
  const COL_GAP = 170;    // место между колонками книг — там идут дуги
  const HEAD_H = 108;     // обложка и название книги над колонкой

  let mapState = null;  // данные карты и настройки фильтров
  let mapView = { x: 0, y: 0, scale: 1 };
  let mapEditing = false;
  let mapDrag = null;
  let mapMoved = 0;
  let mapResizeBound = false;

  /** Порядок идей внутри колонки: у связанных идей похожая высота. */
  function orderColumns(ideas, links, bookIds) {
    const byId = new Map(ideas.map((idea) => [Number(idea.id), idea]));
    const partners = new Map(ideas.map((idea) => [Number(idea.id), []]));
    links.forEach((link) => {
      const from = Number(link.from_id);
      const to = Number(link.to_id);
      if (partners.has(from)) partners.get(from).push(to);
      if (partners.has(to)) partners.get(to).push(from);
    });
    const order = new Map(bookIds.map((bookId) => [
      bookId,
      ideas.filter((idea) => idea.book_id === bookId).slice()
        .sort((a, b) => Number(a.id) - Number(b.id)),
    ]));
    const rank = new Map();
    const rerank = () => {
      order.forEach((list) => list.forEach((idea, index) => {
        rank.set(Number(idea.id), list.length > 1 ? index / (list.length - 1) : 0.5);
      }));
    };
    rerank();
    for (let pass = 0; pass < 6; pass += 1) {
      order.forEach((list, bookId) => {
        const scored = list.map((idea, index) => {
          const own = rank.get(Number(idea.id));
          const others = (partners.get(Number(idea.id)) || []).filter((id) => {
            const other = byId.get(id);
            return other && other.book_id !== bookId;
          });
          const mean = others.length
            ? others.reduce((sum, id) => sum + (rank.get(id) ?? own), 0) / others.length
            : own;
          return { idea, index, score: mean * 0.75 + own * 0.25 };
        });
        scored.sort((a, b) => a.score - b.score || a.index - b.index);
        order.set(bookId, scored.map((item) => item.idea));
      });
      rerank();
    }
    return order;
  }

  let mapMeasure = null;  // холст для точной ширины подписи в пикселях

  /** Обрезает подпись по настоящей ширине шрифта, а не по числу букв. */
  function labelFitter(limitPx) {
    if (!mapMeasure) {
      mapMeasure = document.createElement("canvas").getContext("2d");
      const sans = getComputedStyle(document.documentElement)
        .getPropertyValue("--sans").trim();
      mapMeasure.font = '14px ' + (sans || "sans-serif");
    }
    return (text) => {
      const full = String(text || "").replace(/\s+/g, " ").trim();
      if (!full || mapMeasure.measureText(full).width <= limitPx) return full;
      let low = 0;
      let high = full.length;
      while (low < high) {
        const mid = Math.ceil((low + high) / 2);
        if (mapMeasure.measureText(full.slice(0, mid) + "…").width <= limitPx) low = mid;
        else high = mid - 1;
      }
      return full.slice(0, Math.max(1, low)).replace(/[\s,;:.—-]+$/, "") + "…";
    };
  }

  /** Колонки книг: идеи друг под другом, подписи сбоку от точки. */
  function layoutColumns(ideas, links, width, height) {
    const bookIds = [...new Set(ideas.map((idea) => idea.book_id))];
    const order = orderColumns(ideas, links, bookIds);
    const maxRows = Math.max(1, ...bookIds.map((id) => order.get(id).length));
    const avail = Math.max(120, height - HEAD_H - MAP_MARGIN);
    // Строка не ниже 22px: подпись 14px иначе налезает на соседнюю.
    const rowH = Math.max(18, Math.min(74, avail / maxRows));
    const contentH = Math.max(height, HEAD_H + rowH * maxRows + MAP_MARGIN);
    const usable = Math.max(240, width - MAP_MARGIN * 2 - COL_GAP * Math.max(0, bookIds.length - 1));
    const colW = usable / Math.max(bookIds.length, 1);
    const positions = new Map();
    const columns = [];
    bookIds.forEach((bookId, index) => {
      const list = order.get(bookId);
      const left = MAP_MARGIN + index * (colW + COL_GAP);
      const center = left + colW / 2;
      const outward = center < width / 2 - 1 ? -1 : center > width / 2 + 1 ? 1 : 0;
      const dotX = outward === 0 ? center : center - outward * (colW / 2 - 16);
      const blockTop = HEAD_H + Math.max(0, (avail - rowH * list.length) / 2);
      // Сколько места есть у подписи до края холста — туда она и должна влезть.
      const labelSpace = outward === 0
        ? Math.max(60, colW - 24)
        : outward < 0
          ? Math.max(60, dotX - 14 - MAP_MARGIN)
          : Math.max(60, width - MAP_MARGIN - dotX - 14);
      const fitLabel = labelFitter(labelSpace);
      columns.push({
        bookId, left, center, dotX, outward, top: blockTop, width: colW,
        titleLimit: Math.max(8, Math.round((colW - 12) / 8.5)),
      });
      list.forEach((idea, row) => {
        const y = blockTop + rowH * (row + 0.5);
        positions.set(Number(idea.id), {
          x: dotX, y, row, rowH,
          labelX: outward === 0 ? dotX : dotX + outward * 14,
          anchor: outward === 0 ? "middle" : (outward < 0 ? "end" : "start"),
          below: outward === 0,
          label: fitLabel(idea.title || idea.idea),
        });
      });
    });
    const counts = new Map(bookIds.map((bookId) => [bookId, order.get(bookId).length]));
    return { positions, columns, counts, rowH, contentH };
  }

  function makeMapState(graph, allLoaded) {
    const colorOf = new Map();
    graph.books.forEach((book, index) => {
      colorOf.set(book.id, "var(" + BOOK_VARS[index % BOOK_VARS.length] + ")");
    });
    const byId = new Map(graph.ideas.map((idea) => [Number(idea.id), idea]));
    const links = graph.links.filter(
      (link) => byId.has(Number(link.from_id)) && byId.has(Number(link.to_id))
    );
    return {
      graph,
      links,
      colorOf,
      bookIds: new Set(graph.books.map((book) => book.id)),
      types: new Set(Object.keys(LINK_STYLES)),
      minConf: 0.6,
      labels: graph.ideas.length <= 60,
      allLoaded: Boolean(allLoaded),
      loading: false,
      selected: null,
    };
  }

  function visibleMap() {
    const state = mapState;
    const ideas = state.graph.ideas.filter((idea) => state.bookIds.has(idea.book_id));
    const ideaIds = new Set(ideas.map((idea) => Number(idea.id)));
    const links = state.links.filter(
      (link) =>
        state.types.has(link.type) &&
        Number(link.confidence) >= state.minConf &&
        ideaIds.has(Number(link.from_id)) &&
        ideaIds.has(Number(link.to_id))
    );
    const degree = new Map();
    links.forEach((link) => {
      const from = Number(link.from_id);
      const to = Number(link.to_id);
      degree.set(from, (degree.get(from) || 0) + 1);
      degree.set(to, (degree.get(to) || 0) + 1);
    });
    return { ideas, links, degree };
  }

  function nodeRadius(degree) {
    return 6 + Math.min(5, Math.sqrt(degree) * 1.9);
  }

  function shortText(text, limit) {
    const clean = String(text || "").trim();
    return clean.length > limit ? clean.slice(0, limit).trimEnd() + "…" : clean;
  }

  function markersMarkup() {
    return Object.keys(LINK_STYLES).map((type) => (
      '<marker id="arrow-' + type + '" viewBox="0 0 10 10" refX="9" refY="5"'
      + ' markerWidth="5" markerHeight="5" orient="auto-start-reverse">'
      + '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + LINK_STYLES[type].color + '"/></marker>'
    )).join("");
  }

  function filtersMarkup() {
    const state = mapState;
    const bookCount = new Map();
    state.graph.ideas.forEach((idea) => {
      bookCount.set(idea.book_id, (bookCount.get(idea.book_id) || 0) + 1);
    });
    const typeCount = new Map();
    state.links.forEach((link) => {
      typeCount.set(link.type, (typeCount.get(link.type) || 0) + 1);
    });
    const bookRows = state.graph.books.map((book) => (
      '<label class="frow"><input type="checkbox" data-book="' + esc(book.id) + '"'
      + (state.bookIds.has(book.id) ? " checked" : "")
      + '><span class="fdot" style="background:' + state.colorOf.get(book.id) + '"></span>'
      + '<span>' + esc(shortText(book.title, 22)) + '</span>'
      + '<span class="fcount">' + (bookCount.get(book.id) || 0) + '</span></label>'
    )).join("");
    const typeRows = Object.keys(LINK_STYLES).map((type) => {
      const style = LINK_STYLES[type];
      const borderStyle = style.dash === "7 5" ? "dashed" : style.dash ? "dotted" : "solid";
      return '<label class="frow"><input type="checkbox" data-type="' + type + '"'
        + (state.types.has(type) ? " checked" : "")
        + '><span class="fline" style="border-top-color:' + style.color
        + ";border-top-style:" + borderStyle + '"></span>'
        + '<span>' + LINK_TYPES[type] + '</span>'
        + '<span class="fcount">' + (typeCount.get(type) || 0) + '</span></label>';
    }).join("");
    const percent = Math.round(state.minConf * 100);
    return ''
      + '<h2>Карта идей</h2>'
      + '<p class="count" id="mapCount"></p>'
      + '<div class="fgroup"><p class="fgroup-title">Книги</p>' + bookRows + '</div>'
      + '<div class="fgroup"><p class="fgroup-title">Типы связей</p>' + typeRows + '</div>'
      + '<div class="fgroup"><p class="fgroup-title">Уверенность связи</p>'
      + '<input type="range" class="frange" id="confRange" min="0.5" max="0.9" step="0.05" value="'
      + state.minConf + '">'
      + '<div class="fvalue"><span>50%</span><span id="confValue">не ниже ' + percent + '%</span><span>90%</span></div>'
      + '</div>'
      + '<div class="fgroup"><label class="frow"><input type="checkbox" id="allIdeas"'
      + (state.allLoaded ? " checked" : "") + (state.loading ? " disabled" : "")
      + '><span>Показать все идеи</span></label>'
      + '<p class="fnote">' + (state.allLoaded
        ? "Все идеи, включая одиночные."
        : "Только идеи со связями — чтобы карта не была кашей.") + '</p>'
      + '</div>';
  }

  /** Обложка и название книги над колонкой. */
  function headersMarkup(layout) {
    const books = new Map(mapState.graph.books.map((book) => [book.id, book]));
    return layout.columns.map((col) => {
      const book = books.get(col.bookId) || { id: col.bookId, title: col.bookId, cover: null };
      const coverW = 44;
      const coverH = 62;
      const color = mapState.colorOf.get(col.bookId) || "var(--book-a)";
      const cover = book.cover
        ? '<image href="' + esc(pageBase) + 'covers/' + encodeURIComponent(book.cover)
          + '" x="' + (col.center - coverW / 2).toFixed(1) + '" y="10" width="' + coverW
          + '" height="' + coverH + '" preserveAspectRatio="xMidYMid meet"/>'
        : '<rect x="' + (col.center - coverW / 2).toFixed(1) + '" y="10" width="' + coverW
          + '" height="' + coverH + '" rx="4" fill="' + color + '" opacity=".35"/>'
          + '<text class="map-head-initial" x="' + col.center.toFixed(1)
          + '" y="50" text-anchor="middle">' + esc(String(book.title || "?").slice(0, 1)) + '</text>';
      return '<g class="map-head" data-book="' + esc(col.bookId) + '">' + cover
        + '<text class="map-head-title" x="' + col.center.toFixed(1) + '" y="95" text-anchor="middle">'
        + esc(shortText(book.title, col.titleLimit)) + '</text>'
        + '<text class="map-head-count" x="' + col.center.toFixed(1) + '" y="108" text-anchor="middle">'
        + layout.counts.get(col.bookId) + ' идей</text></g>';
    }).join("");
  }

  function mapShapes(layout) {
    const state = mapState;
    const { ideas, links, degree } = visibleMap();
    const shownIds = new Set(ideas.map((idea) => Number(idea.id)));
    const selected = state.selected && shownIds.has(state.selected) ? state.selected : null;
    const neighbors = new Set();
    if (selected) {
      neighbors.add(selected);
      links.forEach((link) => {
        const from = Number(link.from_id);
        const to = Number(link.to_id);
        if (from === selected) neighbors.add(to);
        if (to === selected) neighbors.add(from);
      });
    }
    const edgeParts = [];
    links.forEach((link) => {
      const from = Number(link.from_id);
      const to = Number(link.to_id);
      const a = layout.positions.get(from);
      const b = layout.positions.get(to);
      if (!a || !b) return;
      const style = LINK_STYLES[link.type] || LINK_STYLES.same;
      const r1 = nodeRadius(degree.get(from) || 0) + 1;
      const r2 = nodeRadius(degree.get(to) || 0) + 2;
      const dim = selected && from !== selected && to !== selected;
      // Дуга выходит из точки горизонтально и так же входит в соседнюю:
      // между колонками это читается как плавная связь, а не как клубок.
      const sign = b.x >= a.x ? 1 : -1;
      const x1 = a.x + sign * r1;
      const x2 = b.x - sign * r2;
      const c1 = x1 + (x2 - x1) * 0.42;
      const c2 = x2 - (x2 - x1) * 0.42;
      edgeParts.push(
        '<path class="map-edge' + (dim ? " dim" : "") + '" data-edge="' + from + "-" + to + '"'
        + ' d="M' + x1.toFixed(1) + " " + a.y.toFixed(1)
        + " C" + c1.toFixed(1) + " " + a.y.toFixed(1)
        + ", " + c2.toFixed(1) + " " + b.y.toFixed(1)
        + ", " + x2.toFixed(1) + " " + b.y.toFixed(1) + '"'
        + ' stroke="' + style.color + '" stroke-width="' + style.width + '"'
        + (style.dash ? ' stroke-dasharray="' + style.dash + '"' : "")
        + ' marker-end="url(#arrow-' + link.type + ')" opacity=".8"/>'
      );
    });
    const nodeParts = ideas.map((idea) => {
      const id = Number(idea.id);
      const point = layout.positions.get(id);
      if (!point) return "";
      const radius = nodeRadius(degree.get(id) || 0);
      const color = state.colorOf.get(idea.book_id) || "var(--book-a)";
      const verdict = idea.verdict === "right" || idea.verdict === "wrong"
        ? ' style="stroke:var(--' + (idea.verdict === "right" ? "supports" : "contradicts")
          + ');stroke-width:2.5"'
        : "";
      const dim = selected && !neighbors.has(id);
      const label = state.labels
        ? '<text class="map-label" x="' + (point.labelX - point.x).toFixed(1) + '"'
          + ' y="' + (point.below ? radius + 18 : 5) + '" text-anchor="' + point.anchor + '">'
          + esc(point.label) + '</text>'
        : "";
      return '<g class="map-node' + (id === selected ? " sel" : "") + (dim ? " dim" : "")
        + '" data-id="' + id + '" transform="translate(' + point.x.toFixed(1) + ","
        + point.y.toFixed(1) + ')"><title>' + esc(idea.idea) + '</title>'
        + '<circle r="' + radius.toFixed(1) + '" fill="' + color + '"' + verdict + '/>'
        + label + '</g>';
    });
    return edgeParts.join("") + nodeParts.join("");
  }

  function renderMapScreen() {
    const state = mapState;
    const { ideas, links } = visibleMap();
    const open = app.querySelector(".map-screen")?.classList.contains("filters-open");
    app.innerHTML = ''
      + '<div class="map-screen' + (open ? " filters-open" : "") + '" id="mapScreen">'
      + '<aside class="map-filters" id="mapFilters">' + filtersMarkup() + '</aside>'
      + '<div class="map-canvas" id="mapCanvas">'
      + '<svg id="mapSvg" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Карта идей">'
      + '<defs>' + markersMarkup() + '</defs>'
      + '<g id="mapWorld"></g>'
      + '</svg>'
      + '<div class="map-tools">'
      + '<button type="button" id="filtersBtn" title="Фильтры">Фильтры</button>'
      + '<button type="button" id="zoomIn" title="Приблизить">+</button>'
      + '<button type="button" id="zoomOut" title="Отдалить">−</button>'
      + '<button type="button" id="zoomReset" class="wide" title="Показать всю карту">Сброс</button>'
      + '<label><input type="checkbox" id="labelsToggle"' + (state.labels ? " checked" : "")
      + '> Подписи</label>'
      + '</div>'
      + (ideas.length
        ? (links.length ? "" : '<div class="map-empty">Все связи скрыты фильтрами — остались только идеи.</div>')
        : '<div class="map-empty">Под фильтры ничего не подошло.</div>')
      + '<aside class="map-panel" id="mapPanel" hidden></aside>'
      + '</div></div>';
    const count = document.getElementById("mapCount");
    if (count) {
      count.textContent = "идей " + ideas.length + " · связей " + links.length
        + (state.allLoaded ? " · все идеи" : "");
    }

    // Второй шаг: узнаём размер холста и раскладываем колонки в пикселях.
    // viewBox равен размеру в пикселях, поэтому подписи 14px видны настоящими.
    const canvas = document.getElementById("mapCanvas");
    const svg = document.getElementById("mapSvg");
    const world = document.getElementById("mapWorld");
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(320, Math.round(rect.width));
    const height = Math.max(320, Math.round(rect.height));
    const layout = layoutColumns(ideas, links, width, height);
    mapSize = { w: width, h: layout.contentH };
    svg.setAttribute("viewBox", "0 0 " + width + " " + layout.contentH);
    svg.style.height = layout.contentH + "px";
    world.innerHTML = headersMarkup(layout) + mapShapes(layout);

    applyView();
    bindMap();
    renderPanel();
    bindMapResize();
  }

  /** Перекладка при повороте экрана или смене размера окна. */
  function bindMapResize() {
    if (mapResizeBound) return;
    mapResizeBound = true;
    let timer = null;
    window.addEventListener("resize", () => {
      if (!document.getElementById("mapCanvas")) return;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!document.getElementById("mapCanvas")) return;
        renderMapScreen();
      }, 150);
    });
  }

  function applyView() {
    const world = document.getElementById("mapWorld");
    if (world) {
      world.setAttribute("transform", "translate(" + mapView.x + " " + mapView.y
        + ") scale(" + mapView.scale + ")");
    }
  }

  function zoomAt(factor) {
    const next = Math.min(3.2, Math.max(0.6, mapView.scale * factor));
    const ratio = next / mapView.scale;
    mapView.x = mapSize.w / 2 - (mapSize.w / 2 - mapView.x) * ratio;
    mapView.y = mapSize.h / 2 - (mapSize.h / 2 - mapView.y) * ratio;
    mapView.scale = next;
    applyView();
  }

  function bindMap() {
    const svg = document.getElementById("mapSvg");
    const screen = document.getElementById("mapScreen");
    const filters = document.getElementById("mapFilters");

    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(1.25));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(1 / 1.25));
    document.getElementById("zoomReset").addEventListener("click", () => {
      mapView = { x: 0, y: 0, scale: 1 };
      applyView();
    });
    document.getElementById("filtersBtn").addEventListener("click", () => {
      screen.classList.toggle("filters-open");
    });
    document.getElementById("labelsToggle").addEventListener("change", (event) => {
      mapState.labels = event.target.checked;
      renderMapScreen();
    });

    filters.querySelectorAll("input[data-book]").forEach((box) => {
      box.addEventListener("change", () => {
        if (box.checked) mapState.bookIds.add(box.dataset.book);
        else mapState.bookIds.delete(box.dataset.book);
        mapStopEditing();
        renderMapScreen();
      });
    });
    filters.querySelectorAll("input[data-type]").forEach((box) => {
      box.addEventListener("change", () => {
        if (box.checked) mapState.types.add(box.dataset.type);
        else mapState.types.delete(box.dataset.type);
        mapStopEditing();
        renderMapScreen();
      });
    });
    const range = document.getElementById("confRange");
    range.addEventListener("input", () => {
      document.getElementById("confValue").textContent =
        "не ниже " + Math.round(Number(range.value) * 100) + "%";
    });
    range.addEventListener("change", () => {
      mapState.minConf = Number(range.value);
      mapStopEditing();
      renderMapScreen();
    });
    document.getElementById("allIdeas").addEventListener("change", (event) => {
      loadMapData(event.target.checked);
    });

    svg.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      mapDrag = { x: event.clientX, y: event.clientY, target: event.target };
      mapMoved = 0;
      svg.setPointerCapture(event.pointerId);
      svg.classList.add("panning");
    });
    svg.addEventListener("pointermove", (event) => {
      if (!mapDrag) return;
      const dx = event.clientX - mapDrag.x;
      const dy = event.clientY - mapDrag.y;
      mapMoved += Math.abs(dx) + Math.abs(dy);
      mapDrag.x = event.clientX;
      mapDrag.y = event.clientY;
      // viewBox равен размеру svg в пикселях, значит 1 единица = 1 px.
      mapView.x += dx;
      mapView.y += dy;
      applyView();
    });
    const stop = (event) => {
      if (!mapDrag) return;
      const target = mapDrag.target;
      const wasClick = mapMoved <= 6;
      mapDrag = null;
      svg.classList.remove("panning");
      if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
      if (wasClick) {
        const node = target && target.closest ? target.closest(".map-node") : null;
        selectIdea(node ? Number(node.dataset.id) : null);
      }
    };
    svg.addEventListener("pointerup", stop);
    svg.addEventListener("pointercancel", () => {
      mapDrag = null;
      svg.classList.remove("panning");
    });
    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, { passive: false });
  }

  function selectIdea(id) {
    mapStopEditing();
    mapState.selected = id;
    const svg = document.getElementById("mapSvg");
    if (svg) {
      const neighbors = new Set();
      if (id) neighbors.add(id);
      svg.querySelectorAll(".map-edge").forEach((line) => {
        const [from, to] = line.dataset.edge.split("-").map(Number);
        const on = !id || from === id || to === id;
        line.classList.toggle("dim", !on);
        if (on && id) {
          neighbors.add(from);
          neighbors.add(to);
        }
      });
      svg.querySelectorAll(".map-node").forEach((group) => {
        const nodeId = Number(group.dataset.id);
        group.classList.toggle("sel", nodeId === id);
        group.classList.toggle("dim", Boolean(id) && !neighbors.has(nodeId));
      });
    }
    renderPanel();
  }

  function mapStopEditing() {
    mapEditing = false;
  }

  function renderPanel() {
    const panel = document.getElementById("mapPanel");
    if (!panel) return;
    const state = mapState;
    const idea = state.selected
      ? state.graph.ideas.find((item) => Number(item.id) === state.selected)
      : null;
    if (!idea) {
      panel.hidden = true;
      panel.innerHTML = "";
      return;
    }
    const related = state.links
      .filter((link) => Number(link.from_id) === Number(idea.id) || Number(link.to_id) === Number(idea.id))
      .sort((a, b) => Number(b.confidence) - Number(a.confidence));
    const byId = new Map(state.graph.ideas.map((item) => [Number(item.id), item]));
    const linksMarkup = related.map((link) => {
      const outgoing = Number(link.from_id) === Number(idea.id);
      const otherId = Number(outgoing ? link.to_id : link.from_id);
      const other = byId.get(otherId);
      if (!other) return "";
      const style = LINK_STYLES[link.type] || LINK_STYLES.same;
      return '<div class="p-link">'
        + '<div class="p-link-type" style="color:' + style.color + '">'
        + (outgoing ? "эта идея " : "") + esc(LINK_TYPES[link.type] || link.type)
        + (outgoing ? "" : " эту идею") + '</div>'
        + '<button type="button" class="p-link-idea" data-id="' + otherId + '">'
        + esc(shortText(other.idea, 90)) + '</button>'
        + '<div class="p-link-book">' + esc(shortText(other.book_title, 34))
        + ' · глава ' + esc(other.chapter) + ' · <span class="p-link-conf">уверенность '
        + Math.round(Number(link.confidence) * 100) + '%</span></div>'
        + (link.explanation ? '<p class="p-link-why">' + esc(link.explanation) + '</p>' : "")
        + '</div>';
    }).join("");
    const verdict = idea.verdict === "right" || idea.verdict === "wrong" ? idea.verdict : "";
    const badge = verdict
      ? '<div class="p-badge ' + verdict + '">' + (verdict === "right" ? "✓ верно" : "✕ неверно") + '</div>'
      : "";
    const color = state.colorOf.get(idea.book_id) || "var(--book-a)";
    panel.innerHTML = ''
      + '<button type="button" class="p-close" title="Закрыть">✕</button>'
      + '<p class="p-kicker"><span class="fdot" style="background:' + color
      + ';display:inline-block;vertical-align:middle;margin-right:6px"></span>'
      + esc(shortText(idea.book_title, 30)) + '</p>'
      + (mapEditing
        ? '<div class="p-edit"><textarea id="pEditText" rows="4">' + esc(idea.idea) + '</textarea>'
          + '<div class="p-edit-actions"><button type="button" class="vbtn" id="pEditSave">Сохранить</button>'
          + '<button type="button" class="vbtn" id="pEditCancel">Отмена</button></div></div>'
        : '<h3 class="p-idea">' + esc(idea.idea) + '</h3>')
      + badge
      + '<p class="p-meta">Глава ' + esc(idea.chapter) + ' · связей: ' + related.length + '</p>'
      + (idea.quote ? '<blockquote class="p-quote"><i>«' + esc(idea.quote) + '»</i></blockquote>' : "")
      + (idea.why ? '<p class="p-why"><b>Почему это важно:</b> ' + esc(idea.why) + '</p>' : "")
      + '<p class="p-links-title">Связи с другими книгами</p>'
      + (linksMarkup || '<p class="p-why">Пока нет связей с другими книгами.</p>')
      + '<div class="p-actions">'
      + '<button type="button" class="vbtn right' + (verdict === "right" ? " on" : "")
      + '" data-verdict="right">✓ Верно</button>'
      + '<button type="button" class="vbtn wrong' + (verdict === "wrong" ? " on" : "")
      + '" data-verdict="wrong">✕ Неверно</button>'
      + '<button type="button" class="vbtn" id="pEditBtn">✎ Изменить</button>'
      + '</div>';
    panel.hidden = false;
    panel.querySelector(".p-close").addEventListener("click", () => selectIdea(null));
    panel.querySelectorAll("[data-verdict]").forEach((button) => {
      button.addEventListener("click", () => saveVerdict(Number(idea.id), button.dataset.verdict));
    });
    panel.querySelector("#pEditBtn").addEventListener("click", () => {
      mapEditing = true;
      renderPanel();
      const textarea = document.getElementById("pEditText");
      if (textarea) {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }
    });
    panel.querySelectorAll(".p-link-idea").forEach((button) => {
      button.addEventListener("click", () => selectIdea(Number(button.dataset.id)));
    });
    const saveButton = panel.querySelector("#pEditSave");
    if (saveButton) {
      saveButton.addEventListener("click", () => {
        const textarea = document.getElementById("pEditText");
        saveIdeaText(Number(idea.id), textarea.value, saveButton);
      });
      panel.querySelector("#pEditCancel").addEventListener("click", () => {
        mapEditing = false;
        renderPanel();
      });
    }
  }

  async function saveVerdict(ideaId, verdict) {
    const idea = mapState.graph.ideas.find((item) => Number(item.id) === ideaId);
    const next = idea && idea.verdict === verdict ? "" : verdict;
    try {
      const data = await api("api/ideas/" + ideaId + "/mark", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ verdict: next }),
      });
      if (idea) idea.verdict = data.verdict;
      mapState.selected = ideaId;
      renderMapScreen();
    } catch (error) {
      alert(error.message);
    }
  }

  async function saveIdeaText(ideaId, text, button) {
    const clean = text.trim();
    if (!clean) {
      alert("Идея не может быть пустой.");
      return;
    }
    button.disabled = true;
    try {
      const data = await api("api/ideas/" + ideaId + "/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idea: clean }),
      });
      const idea = mapState.graph.ideas.find((item) => Number(item.id) === ideaId);
      if (idea) idea.idea = data.idea;
      mapEditing = false;
      renderMapScreen();
    } catch (error) {
      alert(error.message);
      button.disabled = false;
    }
  }

  async function loadMapData(allIdeas) {
    const previous = mapState;
    previous.loading = true;
    renderMapScreen();
    try {
      const graph = await api(allIdeas ? "api/graph?all=1" : "api/graph");
      const selected = previous.selected;
      const fresh = makeMapState(graph, allIdeas);
      fresh.bookIds = previous.bookIds;
      fresh.types = previous.types;
      fresh.minConf = previous.minConf;
      fresh.labels = previous.labels;
      fresh.selected = fresh.graph.ideas.some((idea) => Number(idea.id) === selected)
        ? selected
        : null;
      mapState = fresh;
      mapView = { x: 0, y: 0, scale: 1 };
      mapStopEditing();
      renderMapScreen();
    } catch (error) {
      previous.loading = false;
      renderMapScreen();
      alert(error.message);
    }
  }

  async function showMap() {
    app.classList.add("map-main");
    mapLink.classList.add("active");
    libLink.classList.remove("active");
    if (mapState) {
      renderMapScreen();
      return;
    }
    app.innerHTML = '<div class="map-screen"><div class="map-canvas">'
      + '<div class="map-empty">Строю карту связей…</div></div></div>';
    try {
      const graph = await api("api/graph");
      mapState = makeMapState(graph, false);
    } catch (error) {
      app.innerHTML = '<div class="map-screen"><div class="map-canvas">'
        + '<div class="map-empty">' + esc(error.message) + '</div></div></div>';
      return;
    }
    renderMapScreen();
  }

  function route() {
    const onMap = location.hash === "#/map";
    app.classList.toggle("map-main", onMap);
    mapLink.classList.toggle("active", onMap);
    libLink.classList.toggle("active", !onMap);
    if (onMap) {
      showMap();
      return;
    }
    const idea = location.hash.match(/^#\/idea\/(\d+)$/);
    if (idea) { showIdea(idea[1]); return; }
    const chapter = location.hash.match(/^#\/book\/([^/]+)\/chapter\/(\d+)$/);
    if (chapter) { showChapter(decodeURIComponent(chapter[1]), chapter[2]); return; }
    const match = location.hash.match(/^#\/book\/(.+)$/);
    if (match) showBook(decodeURIComponent(match[1]));
    else showLibrary();
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) uploadBook(fileInput.files[0]);
  });

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("theme", theme);
  }
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
  applyTheme(localStorage.getItem("theme") || "light");

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
